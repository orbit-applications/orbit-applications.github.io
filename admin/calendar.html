<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Calendar · Str8Tech</title>
<style>
  :root { --lime: #A6CE39; --bg: #000; --fg: #fff; --dim: #9a9a9a; --card: #111; --line: #262626; --red: #ff5a5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
  body { font: 18px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 18px 20px 32px; }
  .logo { font-weight: 800; font-size: 22px; }
  .logo span { color: var(--lime); }
  a.back { color: var(--dim); font-size: 15px; text-decoration: none; }
  h1 { font-size: clamp(26px, 6.5vw, 36px); margin: 10px 0 4px; line-height: 1.15; }
  .note { color: var(--dim); font-size: 15px; margin: 4px 0 12px; }
  .nav { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  .nav b { flex: 1; text-align: center; font-size: 22px; }
  .nav button { min-width: 56px; min-height: 48px; border-radius: 12px; border: 2px solid #333; background: #1d1d1d; color: #fff; font-size: 22px; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .dow { text-align: center; color: var(--dim); font-size: 13px; padding: 4px 0; }
  .day { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: #fff; font-size: 16px; cursor: pointer; position: relative; }
  .day.other { opacity: .3; }
  .day.today { border-color: var(--lime); }
  .day.sel { background: var(--lime); color: #000; font-weight: 800; }
  .day .dot { position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }
  .day.sel .dot { background: #000; }
  .ev { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 8px 0; }
  .ev b { font-size: 19px; }
  .ev .meta { color: var(--dim); font-size: 15px; }
  .ev .del { float: right; background: none; border: 0; color: var(--red); font-size: 15px; cursor: pointer; }
  form.add { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 16px; }
  form.add input, form.add textarea { width: 100%; min-height: 52px; border-radius: 12px; border: 2px solid #333; background: #0c0c0c; color: #fff; font-size: 17px; padding: 0 12px; margin: 6px 0; }
  form.add textarea { min-height: 72px; padding: 10px 12px; resize: vertical; }
  form.add .row { display: flex; gap: 10px; }
  form.add .row input { flex: 1; min-width: 0; }
  .btn { display: block; width: 100%; min-height: 60px; border-radius: 16px; border: 0; font-size: 20px; font-weight: 800; cursor: pointer; background: var(--lime); color: #000; margin-top: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Str8<span>Tech</span></div>
  <a class="back" href="./">← Back to the suite</a>
  <h1>Calendar</h1>
  <p class="note" id="note">Team dates, shared with Nash, Barclay and Cole.</p>

  <div class="nav">
    <button id="prev" aria-label="Previous month">‹</button>
    <b id="monthLabel"></b>
    <button id="next" aria-label="Next month">›</button>
  </div>
  <div class="grid" id="grid"></div>

  <h2 style="font-size:22px;margin:20px 0 4px;" id="dayLabel"></h2>
  <div id="events"></div>

  <form class="add" id="addForm">
    <b>Add an event</b>
    <input id="fTitle" type="text" placeholder="Title (e.g. Walk-in at Vivid Nails)" maxlength="120" required>
    <div class="row">
      <input id="fDate" type="date" required>
      <input id="fStart" type="time" aria-label="Start time">
      <input id="fEnd" type="time" aria-label="End time">
    </div>
    <textarea id="fNotes" placeholder="Notes (optional)" maxlength="500"></textarea>
    <button class="btn" type="submit">Add event</button>
  </form>
</div>
<script src="../call/config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var base = (window.STR8TECH_CALL ? STR8TECH_CALL.base() : location.origin).replace(/\/$/, '');
  function pin() { return localStorage.getItem('str8tech-pin') || ''; }
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'X-Staff-Pin': pin(), 'Content-Type': 'application/json' }, opts.headers || {});
    return fetch(base + path, opts);
  }
  var today = new Date();
  var view = new Date(today.getFullYear(), today.getMonth(), 1);
  var sel = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  var events = [];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function load() {
    return api('/api/events').then(function (r) {
      if (r.status === 401) { $('note').textContent = 'That PIN did not work. Go back and re-enter it.'; throw new Error('bad pin'); }
      return r.json();
    }).then(function (list) { events = list || []; render(); }).catch(function () {});
  }
  function render() {
    $('monthLabel').textContent = MONTHS[view.getMonth()] + ' ' + view.getFullYear();
    var g = $('grid');
    g.innerHTML = '';
    ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].forEach(function (d) { var s = document.createElement('div'); s.className = 'dow'; s.textContent = d; g.appendChild(s); });
    var first = new Date(view.getFullYear(), view.getMonth(), 1);
    var start = new Date(first); start.setDate(1 - first.getDay());
    for (var i = 0; i < 42; i++) {
      var d = new Date(start); d.setDate(start.getDate() + i);
      var b = document.createElement('button');
      b.className = 'day' + (d.getMonth() !== view.getMonth() ? ' other' : '') + (iso(d) === iso(today) ? ' today' : '') + (iso(d) === iso(sel) ? ' sel' : '');
      b.textContent = d.getDate();
      if (events.some(function (e) { return e.date === iso(d); })) { var dot = document.createElement('span'); dot.className = 'dot'; b.appendChild(dot); }
      (function (dd) { b.onclick = function () { sel = dd; if (dd.getMonth() !== view.getMonth()) view = new Date(dd.getFullYear(), dd.getMonth(), 1); render(); }; })(d);
      g.appendChild(b);
    }
    var label = sel.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
    $('dayLabel').textContent = label;
    var list = events.filter(function (e) { return e.date === iso(sel); }).sort(function (a, b) { return (a.start || '') < (b.start || '') ? -1 : 1; });
    var box = $('events');
    box.innerHTML = '';
    if (!list.length) { box.innerHTML = '<p class="note">Nothing on this day.</p>'; }
    list.forEach(function (e) {
      var d = document.createElement('div'); d.className = 'ev';
      var del = document.createElement('button'); del.className = 'del'; del.textContent = 'Delete';
      del.onclick = function () { if (confirm('Delete "' + e.title + '"?')) api('/api/events/' + encodeURIComponent(e.id), { method: 'DELETE' }).then(load); };
      d.appendChild(del);
      var b = document.createElement('b'); b.textContent = e.title; d.appendChild(b);
      var m = document.createElement('div'); m.className = 'meta';
      m.textContent = (e.start ? e.start + (e.end ? ' – ' + e.end : '') : 'All day') + (e.notes ? ' · ' + e.notes : '');
      d.appendChild(m);
      box.appendChild(d);
    });
    $('fDate').value = iso(sel);
  }
  $('prev').onclick = function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); render(); };
  $('next').onclick = function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); render(); };
  $('addForm').onsubmit = function (e) {
    e.preventDefault();
    var ev = { title: $('fTitle').value.trim(), date: $('fDate').value, start: $('fStart').value, end: $('fEnd').value, notes: $('fNotes').value.trim() };
    if (!ev.title || !ev.date) return;
    api('/api/events', { method: 'POST', body: JSON.stringify(ev) }).then(function (r) {
      if (!r.ok) throw new Error('save failed');
      $('fTitle').value = ''; $('fNotes').value = ''; $('fStart').value = ''; $('fEnd').value = '';
      sel = new Date(ev.date + 'T12:00:00');
      return load();
    }).catch(function () { $('note').textContent = 'Could not save that event. Check the PIN and try again.'; });
  };
  if (!pin()) { $('note').textContent = 'Enter your staff PIN on the suite page first.'; }
  else load();
})();
</script>
</body>
</html>
