<html lang="en">
<head>
<meta charset="utf-8">

<title>Sheets · Str8Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Nunito:wght@400;700&family=Oswald:wght@400;700&family=Raleway:wght@400;700&family=Ubuntu:wght@400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&family=Inter:wght@400;700&family=Rubik:wght@400;700&family=Quicksand:wght@400;700&family=Comfortaa:wght@400;700&family=Fredoka:wght@400;700&family=Baloo+2:wght@400;700&family=Pacifico&family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Titan+One&family=Bangers&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  /* ===== Google Sheets exact-copy look (default theme) ===== */
  :root {
    --green: #0F9D58; --green-dark: #0B804B; --green-soft: #E6F4EA; --green-border: #CEEBD8;
    --bg: #FFFFFF; --fg: #202124; --dim: #5F6368; --line: #DADCE0; --line-soft: #E8EAED;
    --header-bg: #FFFFFF; --toolbar-bg: #F9F9F9; --grid-header-bg: #F8F9FA; --grid-header-fg: #5F6368;
    --cell-bg: #FFFFFF; --cell-sel-border: #0F9D58; --cell-sel-bg: #E6F4EA;
    --hover: #F1F3F4; --tab-bg: #F8F9FA; --status-bg: #F8F9FA;
    --font: Arial, Helvetica, sans-serif; --accent: #0F9D58;
  }
  /* Dark (Str8Tech) theme */
  body.theme-dark {
    --green: #A6CE39; --green-dark: #8FB82E; --green-soft: rgba(166, 206, 57, .14); --green-border: #2A2E22;
    --bg: #0B0B0C; --fg: #F5F5F2; --dim: #9A9A94; --line: #26272B; --line-soft: #1E1F22;
    --header-bg: #0B0B0C; --toolbar-bg: #141516; --grid-header-bg: #17181A; --grid-header-fg: #9A9A94;
    --cell-bg: #0B0B0C; --cell-sel-border: #A6CE39; --cell-sel-bg: rgba(166, 206, 57, .12);
    --hover: #1E1F22; --tab-bg: #141516; --status-bg: #141516;
    --font: Manrope, -apple-system, sans-serif; --accent: #A6CE39;
  }
  /* Light blue theme */
  body.theme-blue {
    --green: #1A73E8; --green-dark: #1557B0; --green-soft: #E8F0FE; --green-border: #C2D7F8;
    --bg: #FFFFFF; --fg: #202124; --dim: #5F6368; --line: #DADCE0; --line-soft: #E8EAED;
    --header-bg: #FFFFFF; --toolbar-bg: #F8F9FA; --grid-header-bg: #F8F9FA; --grid-header-fg: #5F6368;
    --cell-bg: #FFFFFF; --cell-sel-border: #1A73E8; --cell-sel-bg: #E8F0FE;
    --hover: #F1F3F4; --tab-bg: #F8F9FA; --status-bg: #F8F9FA;
    --font: Arial, Helvetica, sans-serif; --accent: #1A73E8;
  }
  /* Warm theme */
  body.theme-warm {
    --green: #E8710A; --green-dark: #C25E00; --green-soft: #FEF3E2; --green-border: #F5D5A8;
    --bg: #FFFEF9; --fg: #3C4043; --dim: #5F6368; --line: #E8E0D0; --line-soft: #F1EBDD;
    --header-bg: #FFFEF9; --toolbar-bg: #FBF7EE; --grid-header-bg: #FBF7EE; --grid-header-fg: #5F6368;
    --cell-bg: #FFFEF9; --cell-sel-border: #E8710A; --cell-sel-bg: #FEF3E2;
    --hover: #F5EFE2; --tab-bg: #FBF7EE; --status-bg: #FBF7EE;
    --font: Arial, Helvetica, sans-serif; --accent: #E8710A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font-family: var(--font); }
  .hidden { display: none !important; }

  /* ===== Header (Google Sheets style) ===== */
  .gs-header { background: var(--header-bg); border-bottom: 1px solid var(--line); padding: 6px 12px 0; }
  .gs-top { display: flex; align-items: center; gap: 10px; }
  .gs-icon { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .gs-icon svg { width: 30px; height: 30px; }
  .gs-title-wrap { flex: 1; min-width: 0; }
  .gs-title { border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--fg); font-size: 18px; font-weight: 400; padding: 2px 8px; width: 100%; max-width: 420px; outline: none; }
  .gs-title:hover { border-color: var(--line); }
  .gs-title:focus { border-color: var(--accent); }
  .gs-saved { font-size: 12px; color: var(--dim); padding: 0 8px; white-space: nowrap; }
  .gs-style { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); }
  .gs-style select { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 5px 6px; font-size: 13px; outline: none; }
  .gs-back { color: var(--dim); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; padding: 6px 8px; border-radius: 6px; }
  .gs-back:hover { background: var(--hover); color: var(--fg); }
  .gs-menu { display: flex; gap: 2px; margin-top: 2px; flex-wrap: wrap; }
  .gs-menu button { background: none; border: 0; color: var(--fg); font-size: 14px; padding: 5px 9px; border-radius: 4px; cursor: pointer; }
  .gs-menu button:hover { background: var(--hover); }
  .gs-menu button.active { background: var(--hover); }

  /* ===== Toolbar ===== */
  .gs-toolbar { display: flex; align-items: center; gap: 2px; background: var(--toolbar-bg); border-bottom: 1px solid var(--line); padding: 4px 10px; flex-wrap: wrap; }
  .tb { background: none; border: 0; border-radius: 4px; color: var(--fg); font-size: 14px; min-width: 30px; height: 30px; padding: 0 7px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .tb:hover { background: var(--hover); }
  .tb.on { background: var(--green-soft); color: var(--green-dark); }
  .tb:disabled { opacity: .4; cursor: default; }
  .tb b { font-weight: 700; }
  .tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 5px; flex: 0 0 auto; }
  .tb select { border: 1px solid transparent; background: transparent; color: var(--fg); font-size: 13px; border-radius: 4px; padding: 4px 2px; outline: none; max-width: 110px; }
  .tb select:hover { background: var(--hover); }
  .tb input[type=color] { width: 26px; height: 26px; border: 0; background: none; padding: 0; cursor: pointer; }

  /* ===== Formula bar ===== */
  .gs-formula { display: flex; align-items: center; gap: 8px; background: var(--bg); border-bottom: 1px solid var(--line); padding: 4px 12px; }
  .gs-namebox { width: 64px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--fg); font-size: 13px; padding: 5px 8px; text-align: center; outline: none; }
  .gs-fx { color: var(--dim); font-size: 14px; font-style: italic; font-weight: 700; }
  .gs-formula-input { flex: 1; border: 0; background: transparent; color: var(--fg); font-size: 14px; padding: 5px 4px; outline: none; min-width: 0; }

  /* ===== Grid ===== */
  .gs-grid-wrap { overflow: auto; height: calc(100vh - 215px); min-height: 300px; background: var(--bg); }
  table.gs-grid { border-collapse: separate; border-spacing: 0; }
  table.gs-grid th, table.gs-grid td { border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); padding: 0; }
  table.gs-grid thead th { background: var(--grid-header-bg); color: var(--grid-header-fg); font-size: 12px; font-weight: 400; text-align: center; min-width: 100px; height: 24px; position: sticky; top: 0; z-index: 3; cursor: pointer; user-select: none; }
  table.gs-grid thead th.rowh { min-width: 46px; width: 46px; left: 0; z-index: 4; }
  table.gs-grid tbody th { background: var(--grid-header-bg); color: var(--grid-header-fg); font-size: 12px; font-weight: 400; text-align: center; min-width: 46px; width: 46px; height: 25px; position: sticky; left: 0; z-index: 2; cursor: pointer; user-select: none; }
  table.gs-grid thead th.sel, table.gs-grid tbody th.sel { background: var(--green-soft); color: var(--green-dark); font-weight: 700; }
  table.gs-grid td input { width: 100%; height: 25px; border: 0; background: var(--cell-bg); color: var(--fg); font-size: 13px; padding: 0 6px; outline: none; border-radius: 0; margin: 0; }
  table.gs-grid td.sel input { outline: 2px solid var(--cell-sel-border); outline-offset: -2px; background: var(--cell-sel-bg); }
  table.gs-grid tr:first-child td input { font-weight: 400; }

  /* ===== Bottom tabs + status bar ===== */
  .gs-bottom { background: var(--tab-bg); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 4px; padding: 0 10px; height: 36px; }
  .gs-tab { background: var(--bg); border: 1px solid var(--line); border-bottom: 0; border-radius: 6px 6px 0 0; color: var(--green-dark); font-size: 13px; font-weight: 700; padding: 6px 16px; cursor: pointer; }
  .gs-add-tab { background: none; border: 0; color: var(--dim); font-size: 18px; cursor: pointer; border-radius: 50%; width: 26px; height: 26px; }
  .gs-add-tab:hover { background: var(--hover); }
  .gs-status { margin-left: auto; font-size: 12px; color: var(--dim); white-space: nowrap; }

  /* ===== List view (templates + your sheets) ===== */
  .gs-list { max-width: 900px; margin: 0 auto; padding: 20px 20px 40px; }
  .gs-list h1 { font-size: 28px; font-weight: 400; margin: 8px 0 2px; }
  .gs-list .note { color: var(--dim); font-size: 14px; margin: 4px 0 16px; }
  .gs-list h2 { font-size: 16px; font-weight: 700; margin: 22px 0 10px; }
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tpl { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; text-align: left; color: var(--fg); }
  .tpl:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .tpl b { display: block; font-size: 14px; font-weight: 700; }
  .tpl span { color: var(--dim); font-size: 12px; }
  .item { display: flex; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 8px 0; }
  .item .body { flex: 1; min-width: 0; }
  .item b { font-size: 15px; font-weight: 700; display: block; }
  .item .meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .item button { flex: 0 0 auto; background: none; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px 0; }
  .item .open { color: var(--green-dark); margin-right: 12px; }
  .item .del { color: #D93025; }
  .btn { display: inline-block; min-height: 40px; border-radius: 6px; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; padding: 0 18px; margin-top: 10px; }
  .btn.ghost { background: var(--hover); color: var(--fg); }
  .fld { display: block; font-size: 12px; font-weight: 700; color: var(--dim); margin: 16px 0 0; }
  input[type=file] { margin: 8px 0; }
  .menu-pop { position: absolute; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 6px 0; z-index: 50; min-width: 200px; }
  .menu-pop button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--fg); font-size: 14px; padding: 8px 16px; cursor: pointer; }
  .menu-pop button:hover { background: var(--hover); }
  .menu-pop .sep { height: 1px; background: var(--line); margin: 5px 0; }
</style>
</head>
<body>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var base = (window.STR8TECH_CALL ? STR8TECH_CALL.base() : location.origin).replace(/\/$/, '');
  var MAXCOLS = 26, MAXROWS = 200;
  var cols = 10, rows = 50;
  var currentId = null, sheets = [];
  var grid = []; // grid[r][c] = {v: raw string, b,i,u,s, color, bg, fmt, align, font, size}
  var sel = { r: 0, c: 0 };
  var zoom = 100;
  var saveTimer = null, undoStack = [], redoStack = [];
  var STYLE_KEY = 'str8tech-sheets-style';

  // ---------- Style switcher ----------
  function applyStyle(name) {
    document.body.classList.remove('theme-dark', 'theme-blue', 'theme-warm');
    if (name === 'dark') document.body.classList.add('theme-dark');
    else if (name === 'blue') document.body.classList.add('theme-blue');
    else if (name === 'warm') document.body.classList.add('theme-warm');
    // 'google' = default (no extra class)
    localStorage.setItem(STYLE_KEY, name);
    var a = $('styleSel'), b = $('styleSel2');
    if (a) a.value = name;
    if (b) b.value = name;
  }
  function initStyle() {
    var saved = localStorage.getItem(STYLE_KEY) || 'google';
    applyStyle(saved);
    var a = $('styleSel'), b = $('styleSel2');
    if (a) a.onchange = function () { applyStyle(a.value); };
    if (b) b.onchange = function () { applyStyle(b.value); };
  }

  // ---------- Cell model ----------
  function newCell(v) {
    if (v && typeof v === 'object') return { v: String(v.v == null ? '' : v.v), b: !!v.b, i: !!v.i, u: !!v.u, s: !!v.s, color: v.color || '', bg: v.bg || '', fmt: v.fmt || '', align: v.align || '', font: v.font || '', size: v.size || '' };
    return { v: String(v == null ? '' : v), b: false, i: false, u: false, s: false, color: '', bg: '', fmt: '', align: '', font: '', size: '' };
  }
  function ensureGrid(r, c) {
    while (grid.length <= r) grid.push([]);
    while (grid[r].length <= c) grid[r].push(newCell(''));

    format: [['Bold', function () { applyFormat(function (c) { c.b = !c.b; }); }], ['Italic', function () { applyFormat(function (c) { c.i = !c.i; }); }], ['Underline', function () { applyFormat(function (c) { c.u = !c.u; }); }], ['—'], ['Format as $', function () { applyFormat(function (c) { c.fmt = 'currency'; }); }], ['Format as %', function () { applyFormat(function (c) { c.fmt = 'percent'; }); }], ['Plain number', function () { applyFormat(function (c) { c.fmt = ''; }); }]],
    data: [['Sort A to Z', function () { sortCol(sel.c, 1); }], ['Sort Z to A', function () { sortCol(sel.c, -1); }]],
    tools: [['Recalculate', function () { recalcAll(); }]],
    help: [['About', function () { alert('Sheets — a Google Sheets copy for Str8Tech. Type =SUM(A1:A5) and more.'); }]]
  };
  var openMenuEl = null;
  function closeMenu() { if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; } document.querySelectorAll('#menuBar button.active').forEach(function (b) { b.classList.remove('active'); }); }
  document.addEventListener('click', function (e) { if (openMenuEl && !openMenuEl.contains(e.target) && !e.target.closest('button[data-menu]')) closeMenu(); });
  $('menuBar').addEventListener('click', function (e) {
    e.stopPropagation();
    var btn = e.target.closest('button[data-menu]');
    if (!btn) return;
    if (openMenuEl) { closeMenu(); return; }
    btn.classList.add('active');
    var items = MENUS[btn.dataset.menu] || [];
    var pop = document.createElement('div'); pop.className = 'menu-pop';
    items.forEach(function (it) {
      if (it[0] === '—') { var s = document.createElement('div'); s.className = 'sep'; pop.appendChild(s); return; }
      var b = document.createElement('button'); b.type = 'button'; b.textContent = it[0];
      b.onclick = function () { closeMenu(); it[1](); };
      pop.appendChild(b);
    });
    var r = btn.getBoundingClientRect();
    pop.style.left = r.left + 'px'; pop.style.top = (r.bottom + 4) + 'px';
    document.body.appendChild(pop);
    openMenuEl = pop;
  });
  function closeEditor() {
    $('editView').classList.add('hidden');
    $('listView').classList.remove('hidden');
    load();
  }
  function insertRow(at) {
    if (rows >= MAXROWS) return;
    pushUndo();
    grid.splice(at, 0, Array.from({ length: cols }, function () { return newCell(''); }));
    rows++;
    buildGrid(); recalcAll(); scheduleSave();
  }
  function insertCol(at) {
    if (cols >= MAXCOLS) return;
    pushUndo();
    grid.forEach(function (row) { row.splice(at, 0, newCell('')); });
    cols++;
    buildGrid(); recalcAll(); scheduleSave();
  }
  function sortCol(c, dir) {
    pushUndo();
    var body = grid.slice(1);
    body.sort(function (a, b) {
      var av = displayValue(a[c]), bv = displayValue(b[c]);
      var an = parseFloat(String(av).replace(/[$,%\s]/g, '')), bn = parseFloat(String(bv).replace(/[$,%\s]/g, ''));
      if (!isNaN(an) && !isNaN(bn)) return dir * (an - bn);
      return dir * String(av).localeCompare(String(bv));
    });
    grid = [grid[0]].concat(body);
    buildGrid(); recalcAll(); scheduleSave();
  }
  function doUndo() {
    if (!undoStack.length) return;
    redoStack.push(JSON.stringify(gridData()));
    var prev = JSON.parse(undoStack.pop());
    setGridData(prev); buildGrid(); recalcAll(); scheduleSave();
  }
  function doRedo() {
    if (!redoStack.length) return;
    undoStack.push(JSON.stringify(gridData()));
    var next = JSON.parse(redoStack.pop());
    setGridData(next); buildGrid(); recalcAll(); scheduleSave();
  }
  function setZoom(z) {
    zoom = Math.max(50, Math.min(200, z));
    $('zoomLabel').textContent = zoom + '%';
    $('gridWrap').style.fontSize = (zoom / 100 * 14) + 'px';
    var t = $('grid');
    t.style.transform = 'scale(' + (zoom / 100) + ')';
    t.style.transformOrigin = 'top left';
  }

  // ---------- Toolbar wiring ----------
  $('boldBtn').onclick = function () { applyFormat(function (c) { c.b = !c.b; }); };
  $('italicBtn').onclick = function () { applyFormat(function (c) { c.i = !c.i; }); };
  $('underlineBtn').onclick = function () { applyFormat(function (c) { c.u = !c.u; }); };
  $('strikeBtn').onclick = function () { applyFormat(function (c) { c.s = !c.s; }); };
  $('textColor').onchange = function () { var v = this.value; applyFormat(function (c) { c.color = v; }); };
  $('fillColor').onchange = function () { var v = this.value; applyFormat(function (c) { c.bg = v; }); };
  $('fontSel').onchange = function () { var v = this.value; applyFormat(function (c) { c.font = v; }); };
  $('fontSizeSel').onchange = function () { var v = Math.max(8, Math.min(200, parseInt(this.value, 10) || 13)); this.value = v; applyFormat(function (c) { c.size = String(v); }); };
  document.querySelectorAll('[data-fmt]').forEach(function (b) {
    b.onclick = function () {
      var f = b.dataset.fmt;
      applyFormat(function (c) { c.fmt = f === 'dec0' ? 'dec0' : f === 'dec1' ? 'dec1' : f; });
    };
  });
  document.querySelectorAll('[data-align]').forEach(function (b) {
    b.onclick = function () { var a = b.dataset.align; applyFormat(function (c) { c.align = a; }); };
  });
  $('undoBtn').onclick = doUndo;
  $('redoBtn').onclick = doRedo;
  $('printBtn').onclick = function () { window.print(); };
  $('zoomIn').onclick = function () { setZoom(zoom + 10); };
  $('zoomOut').onclick = function () { setZoom(zoom - 10); };
  $('addRowBtn').onclick = function () { insertRow(rows); };
  $('addColBtn').onclick = function () { insertCol(cols); };
  $('saveBtn').onclick = saveSheet;
  $('closeBtn').onclick = closeEditor;
  $('homeIcon').onclick = closeEditor;
  $('addTabBtn').onclick = function () { alert('One sheet per file in this version — use + Blank sheet from the list to start another.'); };

  // ---------- Formula bar ----------
  $('formulaInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      commitCell(sel.r, sel.c, this.value);
      var inp = cellInput(sel.r, sel.c);
      if (inp) { inp.value = displayValue(grid[sel.r][sel.c]); applyCellStyle(inp, grid[sel.r][sel.c]); }
    }
  });
  $('formulaInput').addEventListener('input', function () {
    var inp = cellInput(sel.r, sel.c);
    if (inp) inp.value = this.value;
  });
  $('sheetTitle').addEventListener('change', scheduleSave);

  // ---------- Export ----------
  function csvEscape(v) {
    v = String(v == null ? '' : v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function exportCsv() {
    var data = gridData().map(function (row) {
      return row.map(function (cell) {
        var raw = (cell && typeof cell === 'object') ? cell.v : cell;
        if (String(raw).charAt(0) === '=') return displayValue(typeof cell === 'object' ? cell : newCell(raw));
        return raw;
      });
    });
    var csv = data.map(function (row) { return row.map(csvEscape).join(','); }).join('\n');
    downloadBlob(new Blob([csv], { type: 'text/csv' }), ($('sheetTitle').value.trim() || 'sheet').replace(/[^\w\-]+/g, '-') + '.csv');
  }
  function exportXlsx() {
    try {
      var data = gridData().map(function (row) {
        return row.map(function (cell) {
          var raw = (cell && typeof cell === 'object') ? cell.v : cell;
          return String(raw).charAt(0) === '=' ? displayValue(typeof cell === 'object' ? cell : newCell(raw)) : raw;
        });
      });
      var ws = XLSX.utils.aoa_to_sheet(data);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
      XLSX.writeFile(wb, ($('sheetTitle').value.trim() || 'sheet').replace(/[^\w\-]+/g, '-') + '.xlsx');
    } catch (e) { exportCsv(); }
  }
  function downloadBlob(blob, name) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  $('exportBtn').onclick = exportXlsx;

  // ---------- Upload (.csv / .xlsx) — formulas + formatting preserved ----------
  function parseCsv(text) {
    var rows = [], cur = [''], inQ = false, field = '';
    var i = 0;
    while (i < text.length) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } inQ = false; i++; continue; }
        field += ch; i++; continue;
      }
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === ',') { cur.push(field); field = ''; i++; continue; }
      if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        cur.push(field); field = '';
        rows.push(cur); cur = [''];
        i++; continue;
      }
      field += ch; i++;
    }
    cur.push(field); rows.push(cur);
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
  }
  function xlsxToGrid(ws) {
    var range = XLSX.utils.decode_range(ws['!ref'] || 'A1:A1');
    var rows = [];
    for (var r = range.s.r; r <= range.e.r; r++) {
      var row = [];
      for (var c = range.s.c; c <= range.e.c; c++) {
        var addr = XLSX.utils.encode_cell({ r: r, c: c });
        var cell = ws[addr];
        if (!cell) { row.push(''); continue; }
        // Preserve the FORMULA (cell.f) so it keeps calculating after upload.
        var raw = cell.f ? '=' + cell.f : (cell.v == null ? '' : String(cell.v));
        // Dates: a number cell with a date format is a serial (46335) — use the
        // formatted text (cell.w) so it shows as a real date, not a serial.
        if (!cell.f && cell.t === 'n' && cell.z && XLSX.SSF && XLSX.SSF.is_date(cell.z) && cell.w) {
          raw = cell.w;
        }
        var fmt = {};
        if (cell.s) {
          if (cell.s.font && cell.s.font.bold) fmt.b = true;
          if (cell.s.font && cell.s.font.italic) fmt.i = true;
          if (cell.s.font && cell.s.font.underline) fmt.u = true;
          if (cell.s.font && cell.s.font.color && cell.s.font.color.rgb) fmt.color = '#' + cell.s.font.color.rgb.slice(-6);
          if (cell.s.fill && cell.s.fill.fgColor && cell.s.fill.fgColor.rgb && cell.s.fill.fgColor.rgb !== '00000000') fmt.bg = '#' + cell.s.fill.fgColor.rgb.slice(-6);
          if (cell.s.alignment && cell.s.alignment.horizontal) fmt.align = cell.s.alignment.horizontal;
        }
        if (cell.z) {
          if (/\$|"/.test(cell.z) || /0\.00/.test(cell.z)) fmt.fmt = 'currency';
          else if (/%/.test(cell.z)) fmt.fmt = 'percent';
        }
        row.push(Object.keys(fmt).length ? Object.assign({ v: raw }, fmt) : raw);
      }
      rows.push(row);
    }
    return rows;
  }
  $('uploadFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var title = f.name.replace(/\.[^.]+$/, '');
    var done = function (rows) {
      api('/api/sheets', { method: 'POST', body: JSON.stringify({ title: title, rows: rows }) })
        .then(function (r) { if (!r.ok) throw new Error('save failed'); return r.json(); })
        .then(function (s) { openSheet(s.id); })
        .catch(function () { $('note').textContent = 'Could not save that upload.'; });
    };
    if (/\.csv$/i.test(f.name)) {
      var rd = new FileReader();
      rd.onload = function () { done(parseCsv(String(rd.result || ''))); };
      rd.readAsText(f);
    } else {
      var rd2 = new FileReader();
      rd2.onload = function () {
        try {
          var wb = XLSX.read(rd2.result, { type: 'array', cellStyles: true });
          var ws = wb.Sheets[wb.SheetNames[0]];
          done(xlsxToGrid(ws));
        } catch (e) { $('note').textContent = 'Could not read that file. Try a .csv export from Google Sheets instead.'; }
      };
      rd2.readAsArrayBuffer(f);
    }
    this.value = '';
  });

  $('newBlank').onclick = newBlank;

  initStyle();
  renderTemplates();
  if (!pin()) $('note').textContent = 'Enter your staff PIN on the suite page first.';
  else load();
})();
</script>
</body>
</html>
