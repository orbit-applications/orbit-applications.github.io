<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sheets · Str8Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root { --lime: #A6CE39; --lime-soft: rgba(166, 206, 57, .14); --bg: #0B0B0C; --fg: #F5F5F2; --dim: #9A9A94; --card: #17181A; --card2: #1E1F22; --line: #26272B; --red: #FF6B6B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
  body { font: 16px/1.5 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 20px 40px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
  .logo span { color: var(--lime); }
  a.back { color: var(--dim); font-size: 15px; font-weight: 600; text-decoration: none; }
  a.back:hover { color: var(--fg); }
  h1 { font-size: clamp(30px, 7vw, 40px); font-weight: 800; letter-spacing: -1px; margin: 16px 0 2px; line-height: 1.1; }
  .note { color: var(--dim); font-size: 15px; margin: 4px 0 12px; }
  h2 { font-size: 19px; font-weight: 800; margin: 24px 0 8px; }
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .tpl { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; text-align: left; font-family: Manrope, sans-serif; color: var(--fg); }
  .tpl:hover { border-color: var(--lime); }
  .tpl b { display: block; font-size: 15px; font-weight: 800; }
  .tpl span { color: var(--dim); font-size: 13px; }
  .item { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin: 10px 0; }
  .item .body { flex: 1; min-width: 0; }
  .item b { font-size: 17px; font-weight: 800; display: block; }
  .item .meta { color: var(--dim); font-size: 14px; margin-top: 2px; }
  .item button { flex: 0 0 auto; background: none; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px 0; }
  .item .open { color: var(--lime); margin-right: 12px; }
  .item .del { color: var(--red); }
  .btn { display: block; width: 100%; min-height: 58px; border-radius: 16px; border: 0; font-size: 18px; font-weight: 800; cursor: pointer; background: var(--lime); color: #000; margin-top: 10px; font-family: Manrope, sans-serif; }
  .btn:active { transform: scale(.99); }
  .btn.ghost { background: var(--card2); color: var(--fg); min-height: 50px; font-size: 16px; }
  .btn.small { display: inline-block; width: auto; min-height: 44px; font-size: 15px; padding: 0 18px; margin: 6px 6px 0 0; }
  .fld { display: block; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 14px 0 0; }
  input[type=text], input[type=file] { width: 100%; min-height: 54px; border-radius: 14px; border: 1px solid var(--line); background: #0E0F10; color: var(--fg); font: 600 16px Manrope, sans-serif; padding: 0 14px; margin: 8px 0; }
  input[type=text]:focus { outline: none; border-color: var(--lime); }
  .grid-scroll { overflow-x: auto; margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; }
  table.grid { border-collapse: collapse; min-width: 100%; }
  table.grid th, table.grid td { border: 1px solid var(--line); padding: 0; }
  table.grid th { background: var(--card2); color: var(--dim); font-size: 12px; font-weight: 800; padding: 6px 8px; min-width: 110px; text-align: center; position: sticky; top: 0; }
  table.grid th.rowh { min-width: 36px; width: 36px; }
  table.grid td input { width: 100%; min-height: 40px; border: 0; background: transparent; color: var(--fg); font: 600 15px Manrope, sans-serif; padding: 0 8px; border-radius: 0; margin: 0; }
  table.grid td input:focus { outline: 2px solid var(--lime); outline-offset: -2px; background: #0E0F10; }
  table.grid tr:first-child td input { font-weight: 800; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .toolbar .title { flex: 1; min-width: 200px; margin: 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">Str8<span>Tech</span></div>
    <a class="back" href="./">← Suite</a>
  </div>
  <h1>Sheets</h1>
  <p class="note" id="note">Spreadsheets for the business. Upload a sheet you already made, or start from a template.</p>

  <div id="listView">
    <h2>Start from a template</h2>
    <div class="tpl-grid" id="tplGrid"></div>

    <h2>Your sheets</h2>
    <div id="list"></div>

    <label class="fld" for="uploadFile">Upload a sheet you already made (.csv or .xlsx)</label>
    <input type="file" id="uploadFile" accept=".csv,.xlsx,.xls">
    <button class="btn ghost" id="newBlank" type="button">+ Blank sheet</button>
  </div>

  <div id="editView" class="hidden">
    <div class="toolbar">
      <input class="title" id="sheetTitle" type="text" maxlength="200" placeholder="Sheet title">
      <button class="btn small" id="saveBtn" type="button">Save</button>
      <button class="btn small ghost" id="exportBtn" type="button">Export .csv</button>
      <button class="btn small ghost" id="closeBtn" type="button">Close</button>
    </div>
    <p class="note">Tap a cell to type. The first row is the header. Formulas are not in this version yet — plain values only.</p>
    <div class="grid-scroll"><table class="grid" id="grid"></table></div>
    <button class="btn small" id="addRowBtn" type="button">+ Add row</button>
    <button class="btn small ghost" id="addColBtn" type="button">+ Add column</button>
  </div>
</div>
<script src="../call/config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var base = (window.STR8TECH_CALL ? STR8TECH_CALL.base() : location.origin).replace(/\/$/, '');
  var MAXCOLS = 26, MAXROWS = 200;
  var cols = 10, rows = 20;
  var currentId = null, sheets = [];

  // ---------- Built-in templates ----------
  var TEMPLATES = [
    { title: 'Business Expenses', desc: 'Track what the business spends', rows: [['Date', 'Item', 'Category', 'Paid by', 'Amount', 'Receipt?'], ['2026-11-09', 'Domain + email', 'Domain', 'Barclay', '15.99', 'Yes'], ['', '', '', '', '', '']] },
    { title: 'Client Tracker', desc: 'Who your clients are and where they stand', rows: [['Client', 'Business', 'Phone', 'Email', 'Service', 'Price', 'Deposit paid', 'Status', 'Notes'], ['', '', '', '', '', '', '', 'Lead', '']] },
    { title: 'Website Orders', desc: 'Orders from first call to launch', rows: [['Order #', 'Client', 'Business', 'Design', 'Price', 'Deposit', 'Balance', 'Status', 'Launch date'], ['', '', '', '', '', '', '', 'New', '']] },
    { title: 'Walk-in Outreach', desc: 'Businesses to visit, with results', rows: [['#', 'Business', 'Category', 'Address', 'Phone', 'Email', 'Demo to show', 'Result'], ['1', '', '', '', '', '', '', '']] },
    { title: 'Monthly Budget', desc: 'Budget vs what you spent', rows: [['Category', 'Budgeted', 'Spent', 'Left'], ['Domain', '', '', ''], ['Printer', '', '', ''], ['Merch', '', '', ''], ['Total', '', '', '']] },
    { title: 'Revenue Tracker', desc: 'Money coming in', rows: [['Date', 'Client', 'Service', 'Amount', 'Payment method', 'Paid?'], ['', '', '', '', 'e-transfer', 'Yes']] },
    { title: 'Invoice Tracker', desc: 'Invoices sent and paid', rows: [['Invoice #', 'Client', 'Date', 'Amount', 'Due date', 'Paid?'], ['', '', '', '', '', 'No']] },
    { title: 'Content Calendar', desc: 'Plan posts for TikTok and Instagram', rows: [['Date', 'Platform', 'Post idea', 'Status', 'Link'], ['', 'TikTok', '', 'Idea', ''], ['', 'Instagram', '', 'Idea', '']] },
    { title: 'Price List', desc: 'Your services and prices', rows: [['Service', 'Description', 'Price'], ['Template website', 'A website built from one of our designs', '1000'], ['Custom website', 'A website designed just for you', '1200'], ['Promo video', 'Filmed and edited by Barclay', '2000-3000'], ['Tablet add-on', 'Booking tablet, per tablet', '500']] },
    { title: 'Contact List', desc: 'People and businesses to reach', rows: [['Name', 'Business', 'Role', 'Phone', 'Email', 'Notes'], ['', '', '', '', '', '']] },
    { title: 'Mileage Log', desc: 'Driving for the business', rows: [['Date', 'From', 'To', 'Km', 'Purpose'], ['', '', '', '', '']] },
    { title: 'Subscription Tracker', desc: 'Monthly costs so nothing surprises you', rows: [['Service', 'Cost / month', 'Renewal date', 'Cancel?'], ['', '', '', 'No']] }
  ];

  function pin() { return localStorage.getItem('str8tech-pin') || ''; }
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'X-Staff-Pin': pin(), 'Content-Type': 'application/json' }, opts.headers || {});
    return fetch(base + path, opts);
  }
  function colName(i) { return String.fromCharCode(65 + i); }

  // ---------- List view ----------
  function renderTemplates() {
    var g = $('tplGrid'); g.innerHTML = '';
    TEMPLATES.forEach(function (t) {
      var b = document.createElement('button'); b.className = 'tpl'; b.type = 'button';
      var tb = document.createElement('b'); tb.textContent = t.title;
      var ts = document.createElement('span'); ts.textContent = t.desc;
      b.appendChild(tb); b.appendChild(ts);
      b.onclick = function () { createFromTemplate(t); };
      g.appendChild(b);
    });
  }
  function createFromTemplate(t) {
    var rows = t.rows.map(function (r) { return r.slice(); });
    api('/api/sheets', { method: 'POST', body: JSON.stringify({ title: t.title, rows: rows }) })
      .then(function (r) { if (!r.ok) throw new Error('save failed'); return r.json(); })
      .then(function (s) { openSheet(s.id); })
      .catch(function () { $('note').textContent = 'Could not create that sheet. Check the PIN and try again.'; });
  }
  function load() {
    return api('/api/sheets').then(function (r) {
      if (r.status === 401) { localStorage.removeItem('str8tech-pin'); $('note').textContent = 'That PIN did not work. Go back and re-enter it.'; throw new Error('bad pin'); }
      return r.json();
    }).then(function (list) { sheets = list || []; renderList(); }).catch(function () {});
  }
  function renderList() {
    var box = $('list'); box.innerHTML = '';
    if (!sheets.length) { box.innerHTML = '<p class="note">No sheets yet — pick a template or upload one.</p>'; return; }
    sheets.forEach(function (s) {
      var d = document.createElement('div'); d.className = 'item';
      var body = document.createElement('div'); body.className = 'body';
      var b = document.createElement('b'); b.textContent = s.title; body.appendChild(b);
      var m = document.createElement('div'); m.className = 'meta';
      m.textContent = s.updatedAt ? new Date(s.updatedAt).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : '';
      body.appendChild(m); d.appendChild(body);
      var o = document.createElement('button'); o.className = 'open'; o.textContent = 'Open';
      o.onclick = function () { openSheet(s.id); };
      d.appendChild(o);
      var del = document.createElement('button'); del.className = 'del'; del.textContent = 'Delete';
      del.onclick = function () { if (confirm('Delete "' + s.title + '"?')) api('/api/sheets/' + encodeURIComponent(s.id), { method: 'DELETE' }).then(load); };
      d.appendChild(del);
      box.appendChild(d);
    });
  }

  // ---------- Editor ----------
  function gridData() {
    var out = [];
    var table = $('grid');
    Array.prototype.forEach.call(table.querySelectorAll('tbody tr'), function (tr) {
      var row = [];
      Array.prototype.forEach.call(tr.querySelectorAll('td input'), function (inp) { row.push(inp.value); });
      out.push(row);
    });
    return out;
  }
  function buildGrid(data) {
    rows = Math.max(5, Math.min(MAXROWS, (data && data.length) || 20));
    cols = 10;
    if (data) {
      data.forEach(function (r) { if (r && r.length > cols) cols = Math.min(MAXCOLS, r.length); });
      cols = Math.max(10, cols);
    }
    var t = $('grid'); t.innerHTML = '';
    var thead = document.createElement('thead'); var hr = document.createElement('tr');
    var corner = document.createElement('th'); corner.className = 'rowh'; hr.appendChild(corner);
    for (var c = 0; c < cols; c++) { var th = document.createElement('th'); th.textContent = colName(c); hr.appendChild(th); }
    thead.appendChild(hr); t.appendChild(thead);
    var tb = document.createElement('tbody');
    for (var r = 0; r < rows; r++) {
      var tr = document.createElement('tr');
      var rh = document.createElement('th'); rh.className = 'rowh'; rh.textContent = r + 1; tr.appendChild(rh);
      for (var c2 = 0; c2 < cols; c2++) {
        var td = document.createElement('td');
        var inp = document.createElement('input'); inp.type = 'text';
        inp.value = (data && data[r] && data[r][c2] !== undefined) ? data[r][c2] : '';
        td.appendChild(inp); tr.appendChild(td);
      }
      tb.appendChild(tr);
    }
    t.appendChild(tb);
  }
  function openSheet(id) {
    api('/api/sheets/' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (s) {
      currentId = s.id;
      $('sheetTitle').value = s.title || '';
      buildGrid(s.rows || []);
      $('listView').classList.add('hidden');
      $('editView').classList.remove('hidden');
      window.scrollTo(0, 0);
    }).catch(function () { $('note').textContent = 'Could not open that sheet.'; });
  }
  function newBlank() {
    currentId = null;
    $('sheetTitle').value = 'Untitled sheet';
    buildGrid([]);
    $('listView').classList.add('hidden');
    $('editView').classList.remove('hidden');
    window.scrollTo(0, 0);
  }
  function saveSheet() {
    var title = $('sheetTitle').value.trim() || 'Untitled sheet';
    var payload = JSON.stringify({ title: title, rows: gridData() });
    var req = currentId
      ? api('/api/sheets/' + encodeURIComponent(currentId), { method: 'PUT', body: payload })
      : api('/api/sheets', { method: 'POST', body: payload });
    return req.then(function (r) {
      if (r.status === 401) { localStorage.removeItem('str8tech-pin'); throw new Error('bad pin'); }
      if (!r.ok) throw new Error('save failed');
      return r.json();
    }).then(function (s) {
      currentId = s.id;
      $('note').textContent = 'Saved.';
      return load();
    }).catch(function () { $('note').textContent = 'Could not save. Check the PIN and try again.'; });
  }
  function csvEscape(v) {
    v = String(v == null ? '' : v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function exportCsv() {
    var data = gridData();
    var csv = data.map(function (row) { return row.map(csvEscape).join(','); }).join('\n');
    var blob = new Blob([csv], { type: 'text/csv' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ($('sheetTitle').value.trim() || 'sheet').replace(/[^\w\-]+/g, '-') + '.csv';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  // ---------- Upload (.csv / .xlsx) ----------
  function parseCsv(text) {
    var rows = [], cur = [''], inQ = false, field = '';
    // Simple CSV parser handling quotes + newlines.
    var i = 0;
    while (i < text.length) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i += 2; continue; } inQ = false; i++; continue; }
        field += ch; i++; continue;
      }
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === ',') { cur.push(field); field = ''; i++; continue; }
      if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i + 1] === '\n') i++;
        cur.push(field); field = '';
        rows.push(cur); cur = [''];
        i++; continue;
      }
      field += ch; i++;
    }
    cur.push(field); rows.push(cur);
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
  }
  $('uploadFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var title = f.name.replace(/\.[^.]+$/, '');
    var done = function (rows) {
      api('/api/sheets', { method: 'POST', body: JSON.stringify({ title: title, rows: rows }) })
        .then(function (r) { if (!r.ok) throw new Error('save failed'); return r.json(); })
        .then(function (s) { openSheet(s.id); })
        .catch(function () { $('note').textContent = 'Could not save that upload.'; });
    };
    if (/\.csv$/i.test(f.name)) {
      var rd = new FileReader();
      rd.onload = function () { done(parseCsv(String(rd.result || ''))); };
      rd.readAsText(f);
    } else {
      var rd2 = new FileReader();
      rd2.onload = function () {
        try {
          var wb = XLSX.read(rd2.result, { type: 'array' });
          var ws = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
          done(rows.map(function (r) { return r.map(function (c) { return String(c == null ? '' : c); }); }));
        } catch (e) { $('note').textContent = 'Could not read that file. Try a .csv export from Google Sheets instead.'; }
      };
      rd2.readAsArrayBuffer(f);
    }
    this.value = '';
  });

  $('newBlank').onclick = newBlank;
  $('saveBtn').onclick = saveSheet;
  $('exportBtn').onclick = exportCsv;
  $('closeBtn').onclick = function () { $('editView').classList.add('hidden'); $('listView').classList.remove('hidden'); load(); };
  $('addRowBtn').onclick = function () {
    if (rows >= MAXROWS) return;
    var t = $('grid'); var tb = t.querySelector('tbody');
    var tr = document.createElement('tr');
    var rh = document.createElement('th'); rh.className = 'rowh'; rh.textContent = rows + 1; tr.appendChild(rh);
    for (var c = 0; c < cols; c++) { var td = document.createElement('td'); var inp = document.createElement('input'); inp.type = 'text'; td.appendChild(inp); tr.appendChild(td); }
    tb.appendChild(tr); rows++;
  };
  $('addColBtn').onclick = function () {
    if (cols >= MAXCOLS) return;
    var t = $('grid');
    var hr = t.querySelector('thead tr');
    var th = document.createElement('th'); th.textContent = colName(cols); hr.appendChild(th);
    Array.prototype.forEach.call(t.querySelectorAll('tbody tr'), function (tr) {
      var td = document.createElement('td'); var inp = document.createElement('input'); inp.type = 'text'; td.appendChild(inp); tr.appendChild(td);
    });
    cols++;
  };

  renderTemplates();
  if (!pin()) $('note').textContent = 'Enter your staff PIN on the suite page first.';
  else load();
})();
</script>
</body>
</html>
