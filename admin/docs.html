<style>
  /* ===== Google Docs exact-copy look (default theme) ===== */
  :root {
    --blue: #1A73E8; --blue-dark: #1557B0; --blue-soft: #E8F0FE;
    --bg: #FFFFFF; --fg: #202124; --dim: #5F6368; --line: #DADCE0; --line-soft: #E8EAED;
    --header-bg: #FFFFFF; --toolbar-bg: #F9F9F9; --page-bg: #F8F9FA; --page: #FFFFFF;
    --hover: #F1F3F4; --accent: #1A73E8; --font: Arial, Helvetica, sans-serif;
  }
  body.theme-dark {
    --blue: #A6CE39; --blue-dark: #8FB82E; --blue-soft: rgba(166, 206, 57, .14);
    --bg: #0B0B0C; --fg: #F5F5F2; --dim: #9A9A94; --line: #26272B; --line-soft: #1E1F22;
    --header-bg: #0B0B0C; --toolbar-bg: #141516; --page-bg: #141516; --page: #17181A;
    --hover: #1E1F22; --accent: #A6CE39; --font: Manrope, -apple-system, sans-serif;
  }
  body.theme-green {
    --blue: #0F9D58; --blue-dark: #0B804B; --blue-soft: #E6F4EA;
    --bg: #FFFFFF; --fg: #202124; --dim: #5F6368; --line: #DADCE0; --line-soft: #E8EAED;
    --header-bg: #FFFFFF; --toolbar-bg: #F9F9F9; --page-bg: #F8F9FA; --page: #FFFFFF;
    --hover: #F1F3F4; --accent: #0F9D58; --font: Arial, Helvetica, sans-serif;
  }
  body.theme-warm {
    --blue: #E8710A; --blue-dark: #C25E00; --blue-soft: #FEF3E2;
    --bg: #FFFEF9; --fg: #3C4043; --dim: #5F6368; --line: #E8E0D0; --line-soft: #F1EBDD;
    --header-bg: #FFFEF9; --toolbar-bg: #FBF7EE; --page-bg: #F5EFE2; --page: #FFFEF9;
    --hover: #F5EFE2; --accent: #E8710A; --font: Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: var(--font); }
  .hidden { display: none !important; }

  /* Header */
  .gd-header { background: var(--header-bg); border-bottom: 1px solid var(--line); padding: 6px 12px 0; }
  .gd-top { display: flex; align-items: center; gap: 10px; }
  .gd-icon { width: 36px; height: 36px; flex: 0 0 auto; cursor: pointer; }
  .gd-icon svg { width: 30px; height: 30px; }
  .gd-title-wrap { flex: 1; min-width: 0; }
  .gd-title { border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--fg); font-size: 18px; padding: 2px 8px; width: 100%; max-width: 420px; outline: none; }
  .gd-title:hover { border-color: var(--line); }
  .gd-title:focus { border-color: var(--accent); }
  .gd-saved { font-size: 12px; color: var(--dim); padding: 0 8px; white-space: nowrap; }
  .gd-style { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); }
  .gd-style select { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 5px 6px; font-size: 13px; outline: none; }
  .gd-back { color: var(--dim); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; padding: 6px 8px; border-radius: 6px; }
  .gd-back:hover { background: var(--hover); color: var(--fg); }
  .gd-menu { display: flex; gap: 2px; margin-top: 2px; flex-wrap: wrap; }
  .gd-menu button { background: none; border: 0; color: var(--fg); font-size: 14px; padding: 5px 9px; border-radius: 4px; cursor: pointer; }
  .gd-menu button:hover { background: var(--hover); }
  .gd-menu button.active { background: var(--hover); }

  /* Toolbar */
  .gd-toolbar { display: flex; align-items: center; gap: 2px; background: var(--toolbar-bg); border-bottom: 1px solid var(--line); padding: 4px 10px; flex-wrap: wrap; }
  .tb { background: none; border: 0; border-radius: 4px; color: var(--fg); font-size: 14px; min-width: 30px; height: 30px; padding: 0 7px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .tb:hover { background: var(--hover); }
  .tb.on { background: var(--blue-soft); color: var(--blue-dark); }
  .tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 5px; flex: 0 0 auto; }
  .tb select { border: 1px solid transparent; background: transparent; color: var(--fg); font-size: 13px; border-radius: 4px; padding: 4px 2px; outline: none; max-width: 130px; }
  .tb select:hover { background: var(--hover); }
  .tb input[type=color] { width: 26px; height: 26px; border: 0; background: none; padding: 0; cursor: pointer; }

  /* Page */
  .gd-page-wrap { background: var(--page-bg); padding: 24px 0 60px; min-height: calc(100vh - 150px); }
  .gd-page-wrap.focus { padding-top: 8px; }
  .gd-page { background: var(--page); max-width: 816px; min-height: 1056px; margin: 0 auto; padding: 72px 72px 72px; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  .gd-page-wrap.focus .gd-page { box-shadow: none; }
  .gd-editor { outline: none; font-size: 15px; line-height: 1.6; min-height: 900px; color: var(--fg); }
  .gd-editor h1 { font-size: 26px; margin: 12px 0 8px; font-weight: 400; }
  .gd-editor h2 { font-size: 20px; margin: 12px 0 8px; font-weight: 400; }
  .gd-editor h3 { font-size: 16px; margin: 10px 0 6px; font-weight: 700; }
  .gd-editor p { margin: 8px 0; }
  .gd-editor blockquote { border-left: 3px solid var(--line); margin: 8px 0; padding: 2px 0 2px 14px; color: var(--dim); }
  .gd-editor table { border-collapse: collapse; margin: 10px 0; }
  .gd-editor table td, .gd-editor table th { border: 1px solid var(--line); padding: 6px 10px; min-width: 80px; }
  .gd-editor hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .gd-editor a { color: var(--blue); }
  .gd-editor .doc-comment { background: #FFF2CC; border-bottom: 2px solid #F9AB00; }
  .gd-editor [data-pagenum] { text-align: center; color: #5F6368; font-size: 12px; border-top: 1px solid #DADCE0; padding: 6px 0; margin-top: 16px; }
  .gd-comments { max-width: 816px; margin: 16px auto 0; background: var(--page); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
  .gd-comments h3 { margin: 0 0 8px; font-size: 14px; }
  .gd-comments .cmt { border-top: 1px solid var(--line-soft); padding: 8px 0; font-size: 13px; }
  .gd-comments .cmt b { display: block; font-size: 13px; }
  .gd-comments .cmt span { color: var(--dim); }
  .gd-comments .cmt button { background: none; border: 0; color: var(--blue-dark); font-size: 12px; cursor: pointer; padding: 2px 0; margin-right: 10px; }
  .gd-comments .cmt button.del { color: #D93025; }

  /* Bottom bar */
  .gd-bottom { background: var(--header-bg); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 14px; height: 36px; font-size: 12px; color: var(--dim); position: fixed; bottom: 0; left: 0; right: 0; }
  .gd-bottom button { background: none; border: 0; color: var(--dim); font-size: 12px; cursor: pointer; padding: 4px 6px; border-radius: 4px; }
  .gd-bottom button:hover { background: var(--hover); color: var(--fg); }

  /* List view */
  .gd-list { max-width: 900px; margin: 0 auto; padding: 20px 20px 40px; }
  .gd-list h1 { font-size: 28px; font-weight: 400; margin: 8px 0 2px; }
  .gd-list .note { color: var(--dim); font-size: 14px; margin: 4px 0 16px; }
  .gd-list h2 { font-size: 16px; font-weight: 700; margin: 22px 0 10px; }
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tpl { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; text-align: left; color: var(--fg); }
  .tpl:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .tpl b { display: block; font-size: 14px; font-weight: 700; }
  .tpl span { color: var(--dim); font-size: 12px; }
  .item { display: flex; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 8px 0; }
  .item .body { flex: 1; min-width: 0; }
  .item b { font-size: 15px; font-weight: 700; display: block; }
  .item .meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .item button { flex: 0 0 auto; background: none; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px 0; }
  .item .open { color: var(--blue-dark); margin-right: 12px; }
  .item .del { color: #D93025; }
  .btn { display: inline-block; min-height: 40px; border-radius: 6px; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; padding: 0 18px; margin-top: 10px; }
  .btn.ghost { background: var(--hover); color: var(--fg); }
  .fld { display: block; font-size: 12px; font-weight: 700; color: var(--dim); margin: 16px 0 0; }
  input[type=file] { margin: 8px 0; }
  .menu-pop { position: absolute; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 6px 0; z-index: 50; min-width: 200px; }
  .menu-pop button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--fg); font-size: 14px; padding: 8px 16px; cursor: pointer; }
  .menu-pop button:hover { background: var(--hover); }
  .menu-pop .sep { height: 1px; background: var(--line); margin: 5px 0; }

  @media print {
    .gd-header, .gd-toolbar, .gd-bottom, .gd-list { display: none !important; }
    .gd-page-wrap { background: #fff; padding: 0; }
    .gd-page { box-shadow: none; max-width: none; margin: 0; padding: 0; }
  }
</style>
</head>

<script>

    if (b) b.value = name;

  function pin() { return localStorage.getItem('str8tech-pin') || ''; }
  function api(path, opts) {

    return fetch(base + path, opts);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function renderTemplates() {
    var g = $('tplGrid'); g.innerHTML = '';

  function load() {

  function renderList() {

  function scheduleSave() {

  function saveDoc() {
    var title = $('docTitle').value.trim() || 'Untitled doc';
    var payload = JSON.stringify({ title: title, html: $('editor').innerHTML });
    var req = currentId
      ? api('/api/docs/' + encodeURIComponent(currentId), { method: 'PUT', body: payload })
      : api('/api/docs', { method: 'POST', body: payload });
    return req.then(function (r) {
      if (r.status === 401) { localStorage.removeItem('str8tech-pin'); throw new Error('bad pin'); }

  function updateCounts() {

  // ---------- Tables ----------
  function insertTable() {
    var r = parseInt(prompt('How many rows?', '3'), 10);
    var c = parseInt(prompt('How many columns?', '3'), 10);
    if (isNaN(r) || isNaN(c)) return;
    r = Math.max(1, Math.min(10, r));
    c = Math.max(1, Math.min(8, c));
    var html = '<table><tbody>';
    for (var i = 0; i < r; i++) {
      html += '<tr>';
      for (var j = 0; j < c; j++) html += '<td><br></td>';
      html += '</tr>';
    }
    html += '</tbody></table><p><br></p>';
    // Make sure the editor has a cursor — insertHTML does nothing without one.
    var ed = $('editor');
    ed.focus();
    var s = window.getSelection();
    if (!s.rangeCount || !ed.contains(s.anchorNode)) {
      var range = document.createRange();
      range.selectNodeContents(ed);
      range.collapse(false);
      s.removeAllRanges();
      s.addRange(range);
    }
    document.execCommand('insertHTML', false, html);
    $('editor').focus();
    scheduleSave();
  }
  function tableUnderCursor() {
    var s = window.getSelection();
    if (!s || !s.anchorNode) return null;
    var n = s.anchorNode;
    if (n.nodeType === 3) n = n.parentNode;
    while (n && n !== $('editor')) {
      if (n.tagName === 'TABLE') return n;
      n = n.parentNode;
    }
    return null;
  }
  function addTableRow() {
    var t = tableUnderCursor();
    if (!t) { $('note').textContent = 'Put the cursor inside a table first.'; return; }
    var firstRow = t.querySelector('tr');
    var cols = firstRow ? firstRow.querySelectorAll('td, th').length : 1;
    var tr = document.createElement('tr');
    for (var i = 0; i < Math.max(1, cols); i++) { var td = document.createElement('td'); td.innerHTML = '<br>'; tr.appendChild(td); }
    t.querySelector('tbody').appendChild(tr);
    scheduleSave();
  }
  function addTableCol() {
    var t = tableUnderCursor();
    if (!t) { $('note').textContent = 'Put the cursor inside a table first.'; return; }
    t.querySelectorAll('tr').forEach(function (tr) {
      var td = document.createElement('td'); td.innerHTML = '<br>'; tr.appendChild(td);
    });
    scheduleSave();
  }
  // ---------- Comments ----------
  function addComment() {
    var s = window.getSelection();
    if (!s || s.isCollapsed || !s.toString().trim()) { $('note').textContent = 'Select some text first, then add a comment.'; return; }
    var text = prompt('Comment:', '');
    if (text === null || !text.trim()) return;
    var quoted = s.toString();
    var safe = esc(text.trim()).replace(/"/g, '&quot;');
    var html = '<span class="doc-comment" data-comment="' + safe + '" title="' + safe + '">' + esc(quoted) + '</span>';
    document.execCommand('insertHTML', false, html);
    renderComments();
    scheduleSave();
    $('editor').focus();

  function renderComments() {

      var del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = 'Resolve';
      del.onclick = function () {

  // ---------- Export as .docx (Word) — keeps bold/italic/font/size/color ----------
  function runProps(node, inherited) {
    var p = { bold: !!inherited.bold, italics: !!inherited.italics, underline: !!inherited.underline, strike: !!inherited.strike, color: inherited.color || null, font: inherited.font || null, size: inherited.size || null };
    if (!node || node.nodeType !== 1) return p;
    var tag = node.tagName;
    if (tag === 'B' || tag === 'STRONG') p.bold = true;
    if (tag === 'I' || tag === 'EM') p.italics = true;
    if (tag === 'U') p.underline = true;
    if (tag === 'S' || tag === 'STRIKE') p.strike = true;
    if (tag === 'FONT' && node.getAttribute('face')) p.font = node.getAttribute('face');
    if (tag === 'FONT' && node.getAttribute('color')) p.color = node.getAttribute('color').replace('#', '');
    var cs = node.style || {};
    if (cs.fontWeight && (cs.fontWeight === 'bold' || parseInt(cs.fontWeight, 10) >= 600)) p.bold = true;
    if (cs.fontStyle === 'italic') p.italics = true;
    if (cs.textDecoration && cs.textDecoration.indexOf('underline') >= 0) p.underline = true;
    if (cs.textDecoration && cs.textDecoration.indexOf('line-through') >= 0) p.strike = true;
    if (cs.color) { var m = cs.color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/); if (m) p.color = [parseInt(m[1], 10), parseInt(m[2], 10), parseInt(m[3], 10)].map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join(''); else if (cs.color.charAt(0) === '#') p.color = cs.color.slice(1); }
    if (cs.fontFamily) p.font = cs.fontFamily.split(',')[0].replace(/['"]/g, '').trim();
    if (cs.fontSize) { var px = parseFloat(cs.fontSize); if (px) p.size = Math.round(px * 2); }
    if (cs.backgroundColor && cs.backgroundColor !== 'rgba(0, 0, 0, 0)' && cs.backgroundColor !== 'transparent') { var hm = cs.backgroundColor.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/); if (hm) p.highlight = [parseInt(hm[1], 10), parseInt(hm[2], 10), parseInt(hm[3], 10)].map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join(''); }
    return p;
  }
  function textRuns(node, inherited, out) {
    out = out || [];
    var kids = node.childNodes || [];
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i];
      if (k.nodeType === 3) {
        var t = k.nodeValue || '';
        if (t) {
          var props = runProps(node, inherited);
          var run = { text: t, bold: props.bold, italics: props.italics };
          if (props.underline) run.underline = {};
          if (props.strike) run.strike = true;
          if (props.color) run.color = props.color;
          if (props.font) run.font = props.font;
          if (props.size) run.size = props.size;
          if (props.highlight) run.highlight = props.highlight;
          out.push(run);
        }
      } else if (k.nodeType === 1) {
        if (k.tagName === 'BR') { out.push({ text: '\n', break: 1 }); continue; }
        if (k.tagName === 'IMG') continue;
        textRuns(k, runProps(k, inherited), out);
      }
    }
    return out;
  }
  function blockToParagraph(el) {
    var tag = el.tagName;
    var heading = tag === 'H1' ? docx.HeadingLevel.HEADING_1 : tag === 'H2' ? docx.HeadingLevel.HEADING_2 : tag === 'H3' ? docx.HeadingLevel.HEADING_3 : null;
    var runs = textRuns(el, {});
    var children = runs.map(function (r) {
      if (r.break) return new docx.TextRun({ break: 1 });
      return new docx.TextRun(r);
    });
    if (!children.length) children = [new docx.TextRun({ text: '' })];
    var opts = { children: children };
    if (heading) opts.heading = heading;
    var align = (el.style && el.style.textAlign) || el.getAttribute('align');
    if (align === 'center') opts.alignmentType = docx.AlignmentType.CENTER;
    else if (align === 'right') opts.alignmentType = docx.AlignmentType.RIGHT;
    else if (align === 'justify') opts.alignmentType = docx.AlignmentType.JUSTIFIED;
    return new docx.Paragraph(opts);
  }
  function exportDocx() {
    if (typeof docx === 'undefined') { $('note').textContent = 'Word export library did not load. Check your connection and try again.'; return; }
    var ed = $('editor');
    var children = [];
    var nodes = ed.childNodes;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.nodeType === 3) {
        var t = (n.nodeValue || '').trim();
        if (t) children.push(new docx.Paragraph({ children: [new docx.TextRun({ text: t })] }));
      } else if (n.nodeType === 1) {
        if (n.tagName === 'TABLE') {
          var rows = n.querySelectorAll('tr');
          var tableRows = [];
          rows.forEach(function (tr) {
            var cells = [];
            tr.querySelectorAll('td, th').forEach(function (td) {
              cells.push(new docx.TableCell({ children: [blockToParagraph(td)] }));
            });
            if (cells.length) tableRows.push(new docx.TableRow({ children: cells }));
          });
          if (tableRows.length) children.push(new docx.Table({ rows: tableRows }));
        } else if (n.tagName === 'UL' || n.tagName === 'OL') {
          n.querySelectorAll('li').forEach(function (li) {
            var p = blockToParagraph(li);
            p.bullet = { level: 0 };
            children.push(p);
          });
        } else if (n.tagName === 'HR') {
          children.push(new docx.Paragraph({ children: [new docx.TextRun({ text: '—' })] }));
        } else {
          children.push(blockToParagraph(n));
        }
      }
    }
    if (!children.length) children.push(new docx.Paragraph({ children: [new docx.TextRun({ text: '' })] }));
    var doc = new docx.Document({ sections: [{ children: children }] });
    docx.Packer.toBlob(doc).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = ($('docTitle').value.trim() || 'doc').replace(/[^\w\-]+/g, '-') + '.docx';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      $('note').textContent = 'Downloaded as .docx.';
    }).catch(function () { $('note').textContent = 'Could not make the .docx file.'; });
  }

  };
  // Keep the editor text selection when toolbar buttons are used.
  // Clicking a toolbar button moves focus off the editor and collapses the
  // selection, so execCommand would have nothing to color. We (a) stop toolbar
  // mousedown from stealing focus, and (b) save/restore the range around the
  // native color picker, which always takes focus when it opens.
  var savedRange = null;
  function saveSel() { var s = window.getSelection(); if (s && s.rangeCount) { try { savedRange = s.getRangeAt(0).cloneRange(); } catch (e) { savedRange = null; } } }
  function restoreSel() { if (!savedRange) return; var s = window.getSelection(); try { s.removeAllRanges(); s.addRange(savedRange); } catch (e) {} }
  document.querySelector('.gd-toolbar').addEventListener('mousedown', function (e) {
    saveSel();
    // Don't block the color pickers: their label/input needs the default click
    // to open the native picker. Everything else keeps focus in the editor.
    if (e.target.closest('label')) return;
    e.preventDefault();
  });
  $('textColor').addEventListener('mousedown', saveSel);
  $('hlColor').addEventListener('mousedown', saveSel);
  $('textColor').addEventListener('click', saveSel);
  $('hlColor').addEventListener('click', saveSel);
  $('textColor').onchange = function () { restoreSel(); document.execCommand('foreColor', false, this.value); $('editor').focus(); };
  $('hlColor').onchange = function () { restoreSel(); document.execCommand('hiliteColor', false, this.value); $('editor').focus(); };
  $('tableBtn').onclick = insertTable;
  $('hrBtn').onclick = function () { document.execCommand('insertHorizontalRule', false, null); $('editor').focus(); };
  $('imageBtn').onclick = function () { $('imageFile').click(); };
  $('imageFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var img = '<img src="' + rd.result + '" style="max-width:100%;height:auto" alt="">';
      document.execCommand('insertHTML', false, img);
      $('editor').focus();
      scheduleSave();
    };
    rd.readAsDataURL(f);
    this.value = '';
  });
  // ---------- Find & replace ----------
  function findReplace() {
    var find = prompt('Find:', '');
    if (!find) return;
    var rep = prompt('Replace with:', '');
    if (rep === null) return;
    var ed = $('editor');
    var count = 0;
    // Walk text nodes and replace (keeps formatting outside the replaced text).
    var walker = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (tn) {
      var v = tn.nodeValue || '';
      if (v.indexOf(find) < 0) return;
      var parts = v.split(find);
      count += parts.length - 1;
      tn.nodeValue = parts.join(rep);
    });
    updateCounts(); scheduleSave();
    $('note').textContent = count ? ('Replaced ' + count + ' time' + (count === 1 ? '' : 's') + '.') : 'Not found.';
  }
  function insertHeaderFooter(kind) {
    var text = prompt((kind === 'header' ? 'Header' : 'Footer') + ' text:', '');
    if (text === null) return;
    var ed = $('editor');
    var old = ed.querySelector('[data-' + kind + ']');
    if (old) old.remove();
    var div = document.createElement('div');
    div.setAttribute('data-' + kind, '1');
    div.style.cssText = 'text-align:center;color:#5F6368;font-size:12px;border-bottom:1px solid #DADCE0;padding:4px 0;margin-bottom:12px;';
    if (kind === 'footer') div.style.cssText = 'text-align:center;color:#5F6368;font-size:12px;border-top:1px solid #DADCE0;padding:4px 0;margin-top:12px;';
    div.textContent = text;
    if (kind === 'header') ed.insertBefore(div, ed.firstChild);
    else ed.appendChild(div);
    updateCounts(); scheduleSave();
  }
  $('clearBtn').onclick = function () { document.execCommand('removeFormat', false, null); $('editor').focus(); };
  $('undoBtn').onclick = function () { document.execCommand('undo', false, null); $('editor').focus(); };
  $('redoBtn').onclick = function () { document.execCommand('redo', false, null); $('editor').focus(); };
  $('printBtn').onclick = function () { window.print(); };
  $('focusBtn').onclick = function () {
    $('pageWrap').classList.toggle('focus');
    $('gdHeader').classList.toggle('hidden');
    $('toolbar').classList.toggle('hidden');
    this.textContent = $('pageWrap').classList.contains('focus') ? 'Exit focus' : 'Focus';
  };
  $('saveBtn').onclick = saveDoc;
  $('exportBtn').onclick = exportTxt;
  $('closeBtn').onclick = closeEditor;
  $('homeIcon').onclick = closeEditor;

  // ---------- Menus ----------
  var MENUS = {
    file: [['New doc', function () { newBlank(); }], ['Open…', function () { closeEditor(); }], ['—'], ['Download as .docx', exportDocx], ['Download as .txt', exportTxt], ['—'], ['Print / PDF', function () { window.print(); }], ['Close', closeEditor]],
    edit: [['Undo', function () { document.execCommand('undo', false, null); }], ['Redo', function () { document.execCommand('redo', false, null); }], ['—'], ['Find & replace…', findReplace]],
    view: [['Focus mode', function () { $('focusBtn').click(); }]],
    insert: [['Table…', insertTable], ['Add row to table', addTableRow], ['Add column to table', addTableCol], ['Add comment…', addComment], ['Page number', insertPageNumber], ['Horizontal line', function () { $('hrBtn').click(); }], ['Image…', function () { $('imageBtn').click(); }], ['Link…', function () { var url = prompt('Link address:', 'https://'); if (url) document.execCommand('createLink', false, url); }], ['—'], ['Header…', function () { insertHeaderFooter('header'); }], ['Footer…', function () { insertHeaderFooter('footer'); }]],
    format: [['Bold', function () { document.execCommand('bold', false, null); }], ['Italic', function () { document.execCommand('italic', false, null); }], ['Underline', function () { document.execCommand('underline', false, null); }], ['—'], ['Clear formatting', function () { document.execCommand('removeFormat', false, null); }]],
    tools: [['Word count', function () { alert($('wordCount').textContent + ' · ' + $('charCount').textContent); }]],
    help: [['About', function () { alert('Docs — a Google Docs copy for Str8Tech.'); }]]
  };
  var openMenuEl = null;
  function closeMenu() { if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; } document.querySelectorAll('#menuBar button.active').forEach(function (b) { b.classList.remove('active'); }); }
  document.addEventListener('click', function (e) { if (openMenuEl && !openMenuEl.contains(e.target) && !e.target.closest('button[data-menu]')) closeMenu(); });
  $('menuBar').addEventListener('click', function (e) {
    e.stopPropagation();
    var btn = e.target.closest('button[data-menu]');
    if (!btn) return;
    if (openMenuEl) { closeMenu(); return; }
    btn.classList.add('active');
    var items = MENUS[btn.dataset.menu] || [];
    var pop = document.createElement('div'); pop.className = 'menu-pop';
    items.forEach(function (it) {
      if (it[0] === '—') { var s = document.createElement('div'); s.className = 'sep'; pop.appendChild(s); return; }
      var b = document.createElement('button'); b.type = 'button'; b.textContent = it[0];
      b.onclick = function () { closeMenu(); it[1](); };
      pop.appendChild(b);
    });
    var r = btn.getBoundingClientRect();
    pop.style.left = r.left + 'px'; pop.style.top = (r.bottom + 4) + 'px';
    document.body.appendChild(pop);
    openMenuEl = pop;
  });

  // ---------- Upload (.txt / .md / .docx) — formatting preserved ----------
  $('uploadFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var title = f.name.replace(/\.[^.]+$/, '');
    var saveHtml = function (html) {
      api('/api/docs', { method: 'POST', body: JSON.stringify({ title: title, html: html }) })
        .then(function (r) { if (!r.ok) throw new Error('save failed'); return r.json(); })
        .then(function (d) { openDoc(d.id); })
        .catch(function () { $('note').textContent = 'Could not save that upload.'; });
    };
    if (/\.docx$/i.test(f.name)) {
      var rd = new FileReader();
      rd.onload = function () {
        if (typeof mammoth === 'undefined') { $('note').textContent = 'Could not read that .docx file.'; return; }
        // convertToHtml keeps bold, headings, lists, links, tables.
        mammoth.convertToHtml({ arrayBuffer: rd.result }).then(function (res) { saveHtml(res.value || '<p><br></p>'); }).catch(function () { $('note').textContent = 'Could not read that .docx file.'; });
      };
      rd.readAsArrayBuffer(f);
    } else {
      var rd2 = new FileReader();
      rd2.onload = function () {
        var text = String(rd2.result || '');
        var html = esc(text).split(/\r?\n/).map(function (line) { return '<p>' + (line || '<br>') + '</p>'; }).join('');
        saveHtml(html);
      };
      rd2.readAsText(f);
    }
    this.value = '';
  });

  $('newBlank').onclick = newBlank;

  initStyle();
  renderTemplates();
  if (!pin()) $('note').textContent = 'Enter your staff PIN on the suite page first.';
  else load();
})();
</script>
</body>
</html>
