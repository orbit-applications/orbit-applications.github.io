<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Docs · Str8Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
<style>
  /* ===== Google Docs exact-copy look (default theme) ===== */
  :root {
    --blue: #1A73E8; --blue-dark: #1557B0; --blue-soft: #E8F0FE;
    --bg: #FFFFFF; --fg: #202124; --dim: #5F6368; --line: #DADCE0; --line-soft: #E8EAED;
    --header-bg: #FFFFFF; --toolbar-bg: #F9F9F9; --page-bg: #F8F9FA; --page: #FFFFFF;
    --hover: #F1F3F4; --accent: #1A73E8; --font: Arial, Helvetica, sans-serif;
  }
  body.theme-dark {
    --blue: #A6CE39; --blue-dark: #8FB82E; --blue-soft: rgba(166, 206, 57, .14);
    --bg: #0B0B0C; --fg: #F5F5F2; --dim: #9A9A94; --line: #26272B; --line-soft: #1E1F22;
    --header-bg: #0B0B0C; --toolbar-bg: #141516; --page-bg: #141516; --page: #17181A;
    --hover: #1E1F22; --accent: #A6CE39; --font: Manrope, -apple-system, sans-serif;
  }
  body.theme-green {
    --blue: #0F9D58; --blue-dark: #0B804B; --blue-soft: #E6F4EA;
    --bg: #FFFFFF; --fg: #202124; --dim: #5F6368; --line: #DADCE0; --line-soft: #E8EAED;
    --header-bg: #FFFFFF; --toolbar-bg: #F9F9F9; --page-bg: #F8F9FA; --page: #FFFFFF;
    --hover: #F1F3F4; --accent: #0F9D58; --font: Arial, Helvetica, sans-serif;
  }
  body.theme-warm {
    --blue: #E8710A; --blue-dark: #C25E00; --blue-soft: #FEF3E2;
    --bg: #FFFEF9; --fg: #3C4043; --dim: #5F6368; --line: #E8E0D0; --line-soft: #F1EBDD;
    --header-bg: #FFFEF9; --toolbar-bg: #FBF7EE; --page-bg: #F5EFE2; --page: #FFFEF9;
    --hover: #F5EFE2; --accent: #E8710A; --font: Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input, select { font-family: var(--font); }
  .hidden { display: none !important; }

  /* Header */
  .gd-header { background: var(--header-bg); border-bottom: 1px solid var(--line); padding: 6px 12px 0; }
  .gd-top { display: flex; align-items: center; gap: 10px; }
  .gd-icon { width: 36px; height: 36px; flex: 0 0 auto; cursor: pointer; }
  .gd-icon svg { width: 30px; height: 30px; }
  .gd-title-wrap { flex: 1; min-width: 0; }
  .gd-title { border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--fg); font-size: 18px; padding: 2px 8px; width: 100%; max-width: 420px; outline: none; }
  .gd-title:hover { border-color: var(--line); }
  .gd-title:focus { border-color: var(--accent); }
  .gd-saved { font-size: 12px; color: var(--dim); padding: 0 8px; white-space: nowrap; }
  .gd-style { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); }
  .gd-style select { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 5px 6px; font-size: 13px; outline: none; }
  .gd-back { color: var(--dim); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; padding: 6px 8px; border-radius: 6px; }
  .gd-back:hover { background: var(--hover); color: var(--fg); }
  .gd-menu { display: flex; gap: 2px; margin-top: 2px; flex-wrap: wrap; }
  .gd-menu button { background: none; border: 0; color: var(--fg); font-size: 14px; padding: 5px 9px; border-radius: 4px; cursor: pointer; }
  .gd-menu button:hover { background: var(--hover); }
  .gd-menu button.active { background: var(--hover); }

  /* Toolbar */
  .gd-toolbar { display: flex; align-items: center; gap: 2px; background: var(--toolbar-bg); border-bottom: 1px solid var(--line); padding: 4px 10px; flex-wrap: wrap; }
  .tb { background: none; border: 0; border-radius: 4px; color: var(--fg); font-size: 14px; min-width: 30px; height: 30px; padding: 0 7px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .tb:hover { background: var(--hover); }
  .tb.on { background: var(--blue-soft); color: var(--blue-dark); }
  .tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 5px; flex: 0 0 auto; }
  .tb select { border: 1px solid transparent; background: transparent; color: var(--fg); font-size: 13px; border-radius: 4px; padding: 4px 2px; outline: none; max-width: 130px; }
  .tb select:hover { background: var(--hover); }
  .tb input[type=color] { width: 26px; height: 26px; border: 0; background: none; padding: 0; cursor: pointer; }

  /* Page */
  .gd-page-wrap { background: var(--page-bg); padding: 24px 0 60px; min-height: calc(100vh - 150px); }
  .gd-page-wrap.focus { padding-top: 8px; }
  .gd-page { background: var(--page); max-width: 816px; min-height: 1056px; margin: 0 auto; padding: 72px 72px 72px; box-shadow: 0 1px 6px rgba(0,0,0,.18); }
  .gd-page-wrap.focus .gd-page { box-shadow: none; }
  .gd-editor { outline: none; font-size: 15px; line-height: 1.6; min-height: 900px; color: var(--fg); }
  .gd-editor h1 { font-size: 26px; margin: 12px 0 8px; font-weight: 400; }
  .gd-editor h2 { font-size: 20px; margin: 12px 0 8px; font-weight: 400; }
  .gd-editor h3 { font-size: 16px; margin: 10px 0 6px; font-weight: 700; }
  .gd-editor p { margin: 8px 0; }
  .gd-editor blockquote { border-left: 3px solid var(--line); margin: 8px 0; padding: 2px 0 2px 14px; color: var(--dim); }
  .gd-editor table { border-collapse: collapse; margin: 10px 0; }
  .gd-editor table td, .gd-editor table th { border: 1px solid var(--line); padding: 6px 10px; min-width: 80px; }
  .gd-editor hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  .gd-editor a { color: var(--blue); }

  /* Bottom bar */
  .gd-bottom { background: var(--header-bg); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 14px; height: 36px; font-size: 12px; color: var(--dim); position: fixed; bottom: 0; left: 0; right: 0; }
  .gd-bottom button { background: none; border: 0; color: var(--dim); font-size: 12px; cursor: pointer; padding: 4px 6px; border-radius: 4px; }
  .gd-bottom button:hover { background: var(--hover); color: var(--fg); }

  /* List view */
  .gd-list { max-width: 900px; margin: 0 auto; padding: 20px 20px 40px; }
  .gd-list h1 { font-size: 28px; font-weight: 400; margin: 8px 0 2px; }
  .gd-list .note { color: var(--dim); font-size: 14px; margin: 4px 0 16px; }
  .gd-list h2 { font-size: 16px; font-weight: 700; margin: 22px 0 10px; }
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tpl { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; text-align: left; color: var(--fg); }
  .tpl:hover { border-color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .tpl b { display: block; font-size: 14px; font-weight: 700; }
  .tpl span { color: var(--dim); font-size: 12px; }
  .item { display: flex; gap: 12px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 8px 0; }
  .item .body { flex: 1; min-width: 0; }
  .item b { font-size: 15px; font-weight: 700; display: block; }
  .item .meta { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .item button { flex: 0 0 auto; background: none; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px 0; }
  .item .open { color: var(--blue-dark); margin-right: 12px; }
  .item .del { color: #D93025; }
  .btn { display: inline-block; min-height: 40px; border-radius: 6px; border: 0; font-size: 14px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; padding: 0 18px; margin-top: 10px; }
  .btn.ghost { background: var(--hover); color: var(--fg); }
  .fld { display: block; font-size: 12px; font-weight: 700; color: var(--dim); margin: 16px 0 0; }
  input[type=file] { margin: 8px 0; }
  .menu-pop { position: absolute; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 6px 0; z-index: 50; min-width: 200px; }
  .menu-pop button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--fg); font-size: 14px; padding: 8px 16px; cursor: pointer; }
  .menu-pop button:hover { background: var(--hover); }
  .menu-pop .sep { height: 1px; background: var(--line); margin: 5px 0; }

  @media print {
    .gd-header, .gd-toolbar, .gd-bottom, .gd-list { display: none !important; }
    .gd-page-wrap { background: #fff; padding: 0; }
    .gd-page { box-shadow: none; max-width: none; margin: 0; padding: 0; }
  }
</style>
</head>
<body>
<div id="listView" class="gd-list">
  <div class="gd-top">
    <div class="gd-icon" title="Docs">
      <svg viewBox="0 0 36 36"><rect x="2" y="2" width="32" height="32" rx="4" fill="#1A73E8"/><rect x="8" y="5" width="20" height="26" rx="2" fill="#fff"/><rect x="12" y="11" width="12" height="2" fill="#5F6368"/><rect x="12" y="16" width="12" height="2" fill="#BDC1C6"/><rect x="12" y="21" width="12" height="2" fill="#BDC1C6"/><rect x="12" y="26" width="8" height="2" fill="#BDC1C6"/></svg>
    </div>
    <h1 style="margin:0">Docs</h1>
    <span class="gd-style" style="margin-left:auto">Style
      <select id="styleSel">
        <option value="google">Google</option>
        <option value="dark">Dark</option>
        <option value="green">Green</option>
        <option value="warm">Warm</option>
      </select>
    </span>
    <a class="gd-back" href="./">← Suite</a>
  </div>
  <p class="note" id="note">Documents for the business — just like Google Docs. Upload one you already made, or start from a template.</p>
  <h2>Start from a template</h2>
  <div class="tpl-grid" id="tplGrid"></div>
  <h2>Your docs</h2>
  <div id="list"></div>
  <label class="fld" for="uploadFile">Upload a doc you already made (.txt, .md, or .docx) — formatting is kept</label>
  <input type="file" id="uploadFile" accept=".txt,.md,.docx">
  <br><button class="btn" id="newBlank" type="button">+ Blank doc</button>
</div>

<div id="editView" class="hidden">
  <div class="gd-header" id="gdHeader">
    <div class="gd-top">
      <div class="gd-icon" id="homeIcon" title="Docs">
        <svg viewBox="0 0 36 36"><rect x="2" y="2" width="32" height="32" rx="4" fill="#1A73E8"/><rect x="8" y="5" width="20" height="26" rx="2" fill="#fff"/><rect x="12" y="11" width="12" height="2" fill="#5F6368"/><rect x="12" y="16" width="12" height="2" fill="#BDC1C6"/><rect x="12" y="21" width="12" height="2" fill="#BDC1C6"/><rect x="12" y="26" width="8" height="2" fill="#BDC1C6"/></svg>
      </div>
      <div class="gd-title-wrap">
        <input class="gd-title" id="docTitle" type="text" maxlength="200" value="Untitled doc">
        <div class="gd-saved" id="savedState" style="padding:0 8px">Saved</div>
      </div>
      <span class="gd-style">Style
        <select id="styleSel2">
          <option value="google">Google</option>
          <option value="dark">Dark</option>
          <option value="green">Green</option>
          <option value="warm">Warm</option>
        </select>
      </span>
      <a class="gd-back" href="./">← Suite</a>
    </div>
    <div class="gd-menu" id="menuBar">
      <button data-menu="file">File</button>
      <button data-menu="edit">Edit</button>
      <button data-menu="view">View</button>
      <button data-menu="insert">Insert</button>
      <button data-menu="format">Format</button>
      <button data-menu="tools">Tools</button>
      <button data-menu="help">Help</button>
    </div>
  </div>
  <div class="gd-toolbar" id="toolbar">
    <button class="tb" id="undoBtn" title="Undo">↩</button>
    <button class="tb" id="redoBtn" title="Redo">↪</button>
    <button class="tb" id="printBtn" title="Print / PDF">⎙</button>
    <span class="tb-sep"></span>
    <select id="styleDrop" title="Text style">
      <option value="p">Normal text</option>
      <option value="h1">Title</option>
      <option value="h2">Heading 1</option>
      <option value="h3">Heading 2</option>
      <option value="blockquote">Quote</option>
    </select>
    <select id="fontSel" title="Font">
      <option value="Arial">Arial</option>
      <option value="Manrope">Manrope</option>
      <option value="Georgia">Georgia</option>
      <option value="Courier New">Courier New</option>
      <option value="Times New Roman">Times New Roman</option>
    </select>
    <select id="fontSizeSel" title="Font size">
      <option value="11">11</option>
      <option value="12">12</option>
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15" selected>15</option>
      <option value="18">18</option>
      <option value="20">20</option>
      <option value="24">24</option>
      <option value="28">28</option>
      <option value="36">36</option>
    </select>
    <span class="tb-sep"></span>
    <button class="tb" data-cmd="bold" title="Bold"><b>B</b></button>
    <button class="tb" data-cmd="italic" title="Italic"><i>I</i></button>
    <button class="tb" data-cmd="underline" title="Underline"><u>U</u></button>
    <button class="tb" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
    <label class="tb" title="Text color" style="cursor:pointer">A<input type="color" id="textColor" value="#202124" style="position:absolute;opacity:0;width:1px;height:1px"></label>
    <label class="tb" title="Highlight color" style="cursor:pointer">▦<input type="color" id="hlColor" value="#ffff00" style="position:absolute;opacity:0;width:1px;height:1px"></label>
    <span class="tb-sep"></span>
    <button class="tb" data-cmd="createLink" title="Insert link">🔗</button>
    <button class="tb" data-cmd="justifyLeft" title="Align left">☰</button>
    <button class="tb" data-cmd="justifyCenter" title="Align center">☰</button>
    <button class="tb" data-cmd="justifyRight" title="Align right">☰</button>
    <button class="tb" data-cmd="justifyFull" title="Justify">☰</button>
    <span class="tb-sep"></span>
    <button class="tb" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
    <button class="tb" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
    <button class="tb" id="tableBtn" title="Insert table">Table</button>
    <button class="tb" id="hrBtn" title="Horizontal line">—</button>
    <button class="tb" id="clearBtn" title="Clear formatting">Clear</button>
    <span class="tb-sep"></span>
    <button class="tb" id="focusBtn" title="Focus mode">Focus</button>
    <button class="tb" id="saveBtn" title="Save">Save</button>
    <button class="tb" id="exportBtn" title="Download .txt">Export</button>
    <button class="tb" id="closeBtn" title="Close">Close</button>
  </div>
  <div class="gd-page-wrap" id="pageWrap">
    <div class="gd-page">
      <div class="gd-editor" id="editor" contenteditable="true"></div>
    </div>
  </div>
  <div class="gd-bottom">
    <span id="wordCount">0 words</span>
    <span id="charCount">0 characters</span>
    <button id="pastePlainBtn" style="margin-left:auto">Paste as plain text: Off</button>
  </div>
</div>
<script src="../call/config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var base = (window.STR8TECH_CALL ? STR8TECH_CALL.base() : location.origin).replace(/\/$/, '');
  var currentId = null, docs = [];
  var saveTimer = null, pastePlain = false;
  var STYLE_KEY = 'str8tech-docs-style';

  function applyStyle(name) {
    document.body.classList.remove('theme-dark', 'theme-green', 'theme-warm');
    if (name === 'dark') document.body.classList.add('theme-dark');
    else if (name === 'green') document.body.classList.add('theme-green');
    else if (name === 'warm') document.body.classList.add('theme-warm');
    localStorage.setItem(STYLE_KEY, name);
    var a = $('styleSel'), b = $('styleSel2');
    if (a) a.value = name;
    if (b) b.value = name;
  }
  function initStyle() {
    var saved = localStorage.getItem(STYLE_KEY) || 'google';
    applyStyle(saved);
    var a = $('styleSel'), b = $('styleSel2');
    if (a) a.onchange = function () { applyStyle(a.value); };
    if (b) b.onchange = function () { applyStyle(b.value); };
  }

  var TEMPLATES = [
    { title: 'Client Contract', desc: 'Website order agreement', html: '<h1>Website Agreement — Str8Tech</h1><p><b>Client:</b> ___________<br><b>Business:</b> ___________<br><b>Date:</b> ___________</p><h2>What you get</h2><p>☐ Template website — C$1,000<br>☐ Custom website — C$1,200<br>☐ Promo video add-on — C$2,000–3,000<br>☐ Tablet add-on — C$500 each</p><h2>Payment</h2><p>50% deposit to start, 50% when the site goes live. Paid by e-transfer.</p><h2>Revisions</h2><p>2 revision rounds included. After that, C$50 per update.</p><p>Parent/guardian co-signs for clients under 18.</p><p><br>Client signature: ___________ &nbsp;&nbsp; Date: ___________</p><p>Str8Tech: ___________ &nbsp;&nbsp; Date: ___________</p>' },
    { title: 'Invoice', desc: 'Bill a client', html: '<h1>Invoice</h1><p><b>Str8Tech</b> — Apps, Websites &amp; Video<br>str8tech.ca | support@str8tech.ca</p><p><b>Bill to:</b> ___________<br><b>Date:</b> ___________<br><b>Invoice #:</b> ___________</p><p><b>Service:</b> ___________<br><b>Amount:</b> C$___________</p><p><b>Deposit paid:</b> C$___________<br><b>Balance due:</b> C$___________</p><p>Pay by e-transfer. Thank you for your business!</p>' },
    { title: 'Quote / Estimate', desc: 'Price a job before they commit', html: '<h1>Quote</h1><p><b>Str8Tech</b> — str8tech.ca | support@str8tech.ca</p><p><b>For:</b> ___________<br><b>Date:</b> ___________</p><p><b>Template website:</b> C$1,000<br><b>Custom website:</b> C$1,200<br><b>Promo video:</b> C$2,000–3,000<br><b>Tablet add-on:</b> C$500 each</p><p><b>Total estimate:</b> C$___________</p><p>This quote is good for 30 days. No hosting fee. 50% deposit to start.</p>' },
    { title: 'Outreach Email', desc: 'Pitch a business that has no website', html: '<p>Hi [name],</p><p>I noticed [business name] doesn\'t have a website yet — when people Google you, they only find a Facebook page / directory listing.</p><p>I build websites for Calgary businesses. I already made a demo of what yours could look like: [demo link]</p><p>A template site is C$1,000, custom is C$1,200, no hosting fee. Happy to show you the demo in person.</p><p>Thanks from the Str8Tech team,<br>Apps, Websites &amp; Video<br>str8tech.ca | Phone: str8tech.ca/call</p>' },
    { title: 'Meeting Notes', desc: 'Notes from a client meeting', html: '<h1>Meeting Notes</h1><p><b>Date:</b> ___________<br><b>Who was there:</b> ___________<br><b>Business:</b> ___________</p><h2>What they want</h2><p></p><h2>Decisions</h2><p></p><h2>Next steps</h2><p></p>' },
    { title: 'Website Brief', desc: 'Questions to ask a new client', html: '<h1>Website Brief</h1><p><b>Business name:</b> ___________<br><b>What do you do?</b> ___________<br><b>Who are your customers?</b> ___________</p><h2>Pages needed</h2><p>☐ Home &nbsp; ☐ Services &nbsp; ☐ About &nbsp; ☐ Gallery &nbsp; ☐ Booking &nbsp; ☐ Contact</p><h2>Style</h2><p><b>Colors you like:</b> ___________<br><b>Other websites you like:</b> ___________</p><h2>Booking / payments</h2><p>☐ Booking portal &nbsp; ☐ Online payments (Square / Stripe) &nbsp; ☐ Tablet add-on</p>' },
    { title: 'Receipt', desc: 'Proof of payment', html: '<h1>Receipt</h1><p><b>Str8Tech</b> — str8tech.ca | support@str8tech.ca</p><p><b>Date:</b> ___________<br><b>Received from:</b> ___________<br><b>For:</b> ___________<br><b>Amount:</b> C$___________<br><b>Payment method:</b> e-transfer</p><p>Thank you!</p>' },
    { title: 'Thank You Note', desc: 'After a site goes live', html: '<p>Hi [name],</p><p>Your website is live! Thank you for trusting Str8Tech with it.</p><p>If you ever want changes, the first 2 revision rounds are included — after that it\'s C$50 per update. Just reply to this email or call us.</p><p>Thanks from the Str8Tech team,<br>Apps, Websites &amp; Video<br>str8tech.ca</p>' },
    { title: 'Business Plan Outline', desc: 'The plan, section by section', html: '<h1>Business Plan</h1><h2>What we do</h2><p>Apps, websites, and video for local businesses.</p><h2>Who we serve</h2><p></p><h2>Services &amp; prices</h2><p>Template website C$1,000 · Custom website C$1,200 · Promo video C$2,000–3,000 · Tablet C$500</p><h2>Goals</h2><p>3 clients by December · 10 by March · 25+ in 2027</p><h2>Team</h2><p>Nash — builds apps and websites · Barclay — video and adult business duties · Cole — marketing and business support</p>' },
    { title: 'Terms of Service', desc: 'Basic terms for clients', html: '<h1>Terms of Service — Str8Tech</h1><p><b>Payment:</b> 50% deposit to start, 50% when the site goes live, by e-transfer.</p><p><b>Revisions:</b> 2 revision rounds included. After that, C$50 per update.</p><p><b>Content:</b> The client provides their own text, photos, and logo, and confirms they have the right to use them.</p><p><b>Hosting:</b> No hosting fee. The site is hosted on GitHub Pages.</p><p><b>Ownership:</b> Once paid in full, the website belongs to the client.</p>' },
    { title: 'Privacy Policy', desc: 'What the order form collects', html: '<h1>Privacy Policy — Str8Tech</h1><p>When you fill in our order form, we collect your name, business name, email, and phone number so we can build your website and contact you about it.</p><p>We do not sell your information. We do not run ads or trackers on our site.</p><p>Questions: support@str8tech.ca</p>' },
    { title: 'Launch Checklist', desc: 'Before a site goes live', html: '<h1>Launch Checklist</h1><p>☐ Client approved the design<br>☐ All pages proofread<br>☐ Phone, email, and address correct<br>☐ Demo links replaced with the real business info<br>☐ Payment banner removed (if it was a demo)<br>☐ Order form tested<br>☐ Site loads on a phone<br>☐ Balance paid<br>☐ Client shown how to ask for updates</p>' }
  ];

  function pin() { return localStorage.getItem('str8tech-pin') || ''; }
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'X-Staff-Pin': pin(), 'Content-Type': 'application/json' }, opts.headers || {});
    return fetch(base + path, opts);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function renderTemplates() {
    var g = $('tplGrid'); g.innerHTML = '';
    TEMPLATES.forEach(function (t) {
      var b = document.createElement('button'); b.className = 'tpl'; b.type = 'button';
      var tb = document.createElement('b'); tb.textContent = t.title;
      var ts = document.createElement('span'); ts.textContent = t.desc;
      b.appendChild(tb); b.appendChild(ts);
      b.onclick = function () { createFromTemplate(t); };
      g.appendChild(b);
    });
  }
  function createFromTemplate(t) {
    api('/api/docs', { method: 'POST', body: JSON.stringify({ title: t.title, html: t.html }) })
      .then(function (r) { if (!r.ok) throw new Error('save failed'); return r.json(); })
      .then(function (d) { openDoc(d.id); })
      .catch(function () { $('note').textContent = 'Could not create that doc. Check the PIN and try again.'; });
  }
  function load() {
    return api('/api/docs').then(function (r) {
      if (r.status === 401) { localStorage.removeItem('str8tech-pin'); $('note').textContent = 'That PIN did not work. Go back and re-enter it.'; throw new Error('bad pin'); }
      return r.json();
    }).then(function (list) { docs = list || []; renderList(); }).catch(function () {});
  }
  function renderList() {
    var box = $('list'); box.innerHTML = '';
    if (!docs.length) { box.innerHTML = '<p class="note">No docs yet — pick a template or upload one.</p>'; return; }
    docs.forEach(function (d) {
      var dv = document.createElement('div'); dv.className = 'item';
      var body = document.createElement('div'); body.className = 'body';
      var b = document.createElement('b'); b.textContent = d.title; body.appendChild(b);
      var m = document.createElement('div'); m.className = 'meta';
      m.textContent = d.updatedAt ? new Date(d.updatedAt).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : '';
      body.appendChild(m); dv.appendChild(body);
      var o = document.createElement('button'); o.className = 'open'; o.textContent = 'Open';
      o.onclick = function () { openDoc(d.id); };
      dv.appendChild(o);
      var del = document.createElement('button'); del.className = 'del'; del.textContent = 'Delete';
      del.onclick = function () { if (confirm('Delete "' + d.title + '"?')) api('/api/docs/' + encodeURIComponent(d.id), { method: 'DELETE' }).then(load); };
      dv.appendChild(del);
      box.appendChild(dv);
    });
  }
  function openDoc(id) {
    api('/api/docs/' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (d) {
      currentId = d.id;
      $('docTitle').value = d.title || '';
      $('editor').innerHTML = d.html || '<p><br></p>';
      $('listView').classList.add('hidden');
      $('editView').classList.remove('hidden');
      $('savedState').textContent = 'Saved';
      updateCounts();
      window.scrollTo(0, 0);
    }).catch(function () { $('note').textContent = 'Could not open that doc.'; });
  }
  function newBlank() {
    currentId = null;
    $('docTitle').value = 'Untitled doc';
    $('editor').innerHTML = '<p><br></p>';
    $('listView').classList.add('hidden');
    $('editView').classList.remove('hidden');
    $('savedState').textContent = 'Not saved yet';
    updateCounts();
    window.scrollTo(0, 0);
  }
  function scheduleSave() {
    $('savedState').textContent = 'Saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDoc, 1000);
  }
  function saveDoc() {
    var title = $('docTitle').value.trim() || 'Untitled doc';
    var payload = JSON.stringify({ title: title, html: $('editor').innerHTML });
    var req = currentId
      ? api('/api/docs/' + encodeURIComponent(currentId), { method: 'PUT', body: payload })
      : api('/api/docs', { method: 'POST', body: payload });
    return req.then(function (r) {
      if (r.status === 401) { localStorage.removeItem('str8tech-pin'); throw new Error('bad pin'); }
      if (!r.ok) throw new Error('save failed');
      return r.json();
    }).then(function (d) {
      currentId = d.id;
      $('savedState').textContent = 'Saved ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }).catch(function () { $('savedState').textContent = 'Could not save. Check the PIN.'; });
  }
  function updateCounts() {
    var text = $('editor').innerText || '';
    var words = text.trim() ? text.trim().split(/\s+/).length : 0;
    $('wordCount').textContent = words + (words === 1 ? ' word' : ' words');
    $('charCount').textContent = text.length + ' characters';
  }
  function closeEditor() {
    $('editView').classList.add('hidden');
    $('listView').classList.remove('hidden');
    $('pageWrap').classList.remove('focus');
    load();
  }
  function exportTxt() {
    var text = $('editor').innerText || '';
    var blob = new Blob([text], { type: 'text/plain' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ($('docTitle').value.trim() || 'doc').replace(/[^\w\-]+/g, '-') + '.txt';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  // ---------- Editor events ----------
  $('editor').addEventListener('input', function () { updateCounts(); scheduleSave(); });
  $('editor').addEventListener('paste', function (e) {
    if (!pastePlain) return;
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  $('docTitle').addEventListener('change', scheduleSave);
  $('pastePlainBtn').onclick = function () {
    pastePlain = !pastePlain;
    this.textContent = 'Paste as plain text: ' + (pastePlain ? 'On' : 'Off');
  };

  // ---------- Toolbar ----------
  Array.prototype.forEach.call(document.querySelectorAll('.tb[data-cmd]'), function (b) {
    b.onclick = function () {
      var cmd = b.getAttribute('data-cmd');
      if (cmd === 'createLink') {
        var url = prompt('Link address:', 'https://');
        if (url) document.execCommand('createLink', false, url);
      } else {
        document.execCommand(cmd, false, null);
      }
      $('editor').focus();
    };
  });
  $('styleDrop').onchange = function () {
    var v = this.value;
    if (v === 'p') document.execCommand('formatBlock', false, 'p');
    else if (v === 'h1') document.execCommand('formatBlock', false, 'h1');
    else if (v === 'h2') document.execCommand('formatBlock', false, 'h2');
    else if (v === 'h3') document.execCommand('formatBlock', false, 'h3');
    else if (v === 'blockquote') document.execCommand('formatBlock', false, 'blockquote');
    $('editor').focus();
  };
  $('fontSel').onchange = function () { document.execCommand('fontName', false, this.value); $('editor').focus(); };
  $('fontSizeSel').onchange = function () {
    // execCommand fontSize uses 1-7; map px to nearest step, then fix with a span.
    var px = parseInt(this.value, 10);
    document.execCommand('fontSize', false, '4');
    var spans = $('editor').querySelectorAll('font[size="4"]');
    Array.prototype.forEach.call(spans, function (s) {
      var span = document.createElement('span');
      span.style.fontSize = px + 'px';
      while (s.firstChild) span.appendChild(s.firstChild);
      s.parentNode.replaceChild(span, s);
    });
    $('editor').focus();
  };
  $('textColor').onchange = function () { document.execCommand('foreColor', false, this.value); $('editor').focus(); };
  $('hlColor').onchange = function () { document.execCommand('hiliteColor', false, this.value); $('editor').focus(); };
  $('tableBtn').onclick = function () {
    var html = '<table><tbody><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td></tr></tbody></table><p><br></p>';
    document.execCommand('insertHTML', false, html);
    $('editor').focus();
  };
  $('hrBtn').onclick = function () { document.execCommand('insertHorizontalRule', false, null); $('editor').focus(); };
  $('clearBtn').onclick = function () { document.execCommand('removeFormat', false, null); $('editor').focus(); };
  $('undoBtn').onclick = function () { document.execCommand('undo', false, null); $('editor').focus(); };
  $('redoBtn').onclick = function () { document.execCommand('redo', false, null); $('editor').focus(); };
  $('printBtn').onclick = function () { window.print(); };
  $('focusBtn').onclick = function () {
    $('pageWrap').classList.toggle('focus');
    $('gdHeader').classList.toggle('hidden');
    $('toolbar').classList.toggle('hidden');
    this.textContent = $('pageWrap').classList.contains('focus') ? 'Exit focus' : 'Focus';
  };
  $('saveBtn').onclick = saveDoc;
  $('exportBtn').onclick = exportTxt;
  $('closeBtn').onclick = closeEditor;
  $('homeIcon').onclick = closeEditor;

  // ---------- Menus ----------
  var MENUS = {
    file: [['New doc', function () { newBlank(); }], ['Open…', function () { closeEditor(); }], ['—'], ['Download as .txt', exportTxt], ['—'], ['Print / PDF', function () { window.print(); }], ['Close', closeEditor]],
    edit: [['Undo', function () { document.execCommand('undo', false, null); }], ['Redo', function () { document.execCommand('redo', false, null); }]],
    view: [['Focus mode', function () { $('focusBtn').click(); }]],
    insert: [['Table (3x3)', function () { $('tableBtn').click(); }], ['Horizontal line', function () { $('hrBtn').click(); }], ['Link…', function () { var url = prompt('Link address:', 'https://'); if (url) document.execCommand('createLink', false, url); }]],
    format: [['Bold', function () { document.execCommand('bold', false, null); }], ['Italic', function () { document.execCommand('italic', false, null); }], ['Underline', function () { document.execCommand('underline', false, null); }], ['—'], ['Clear formatting', function () { document.execCommand('removeFormat', false, null); }]],
    tools: [['Word count', function () { alert($('wordCount').textContent + ' · ' + $('charCount').textContent); }]],
    help: [['About', function () { alert('Docs — a Google Docs copy for Str8Tech.'); }]]
  };
  var openMenuEl = null;
  function closeMenu() { if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; } document.querySelectorAll('#menuBar button.active').forEach(function (b) { b.classList.remove('active'); }); }
  document.addEventListener('click', function (e) { if (openMenuEl && !openMenuEl.contains(e.target)) closeMenu(); });
  $('menuBar').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-menu]');
    if (!btn) return;
    if (openMenuEl) { closeMenu(); return; }
    btn.classList.add('active');
    var items = MENUS[btn.dataset.menu] || [];
    var pop = document.createElement('div'); pop.className = 'menu-pop';
    items.forEach(function (it) {
      if (it[0] === '—') { var s = document.createElement('div'); s.className = 'sep'; pop.appendChild(s); return; }
      var b = document.createElement('button'); b.type = 'button'; b.textContent = it[0];
      b.onclick = function () { closeMenu(); it[1](); };
      pop.appendChild(b);
    });
    var r = btn.getBoundingClientRect();
    pop.style.left = r.left + 'px'; pop.style.top = (r.bottom + 4) + 'px';
    document.body.appendChild(pop);
    openMenuEl = pop;
  });

  // ---------- Upload (.txt / .md / .docx) — formatting preserved ----------
  $('uploadFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var title = f.name.replace(/\.[^.]+$/, '');
    var saveHtml = function (html) {
      api('/api/docs', { method: 'POST', body: JSON.stringify({ title: title, html: html }) })
        .then(function (r) { if (!r.ok) throw new Error('save failed'); return r.json(); })
        .then(function (d) { openDoc(d.id); })
        .catch(function () { $('note').textContent = 'Could not save that upload.'; });
    };
    if (/\.docx$/i.test(f.name)) {
      var rd = new FileReader();
      rd.onload = function () {
        if (typeof mammoth === 'undefined') { $('note').textContent = 'Could not read that .docx file.'; return; }
        // convertToHtml keeps bold, headings, lists, links, tables.
        mammoth.convertToHtml({ arrayBuffer: rd.result }).then(function (res) { saveHtml(res.value || '<p><br></p>'); }).catch(function () { $('note').textContent = 'Could not read that .docx file.'; });
      };
      rd.readAsArrayBuffer(f);
    } else {
      var rd2 = new FileReader();
      rd2.onload = function () {
        var text = String(rd2.result || '');
        var html = esc(text).split(/\r?\n/).map(function (line) { return '<p>' + (line || '<br>') + '</p>'; }).join('');
        saveHtml(html);
      };
      rd2.readAsText(f);
    }
    this.value = '';
  });

  $('newBlank').onclick = newBlank;

  initStyle();
  renderTemplates();
  if (!pin()) $('note').textContent = 'Enter your staff PIN on the suite page first.';
  else load();
})();
</script>
</body>
</html>
