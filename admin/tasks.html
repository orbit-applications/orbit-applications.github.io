<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tasks · Str8Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --lime: #A6CE39; --lime-soft: rgba(166, 206, 57, .14); --bg: #0B0B0C; --fg: #F5F5F2; --dim: #9A9A94; --card: #17181A; --card2: #1E1F22; --line: #26272B; --red: #FF6B6B; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
  body { font: 16px/1.5 Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 20px 40px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
  .logo span { color: var(--lime); }
  a.back { color: var(--dim); font-size: 15px; font-weight: 600; text-decoration: none; }
  a.back:hover { color: var(--fg); }
  h1 { font-size: clamp(30px, 7vw, 40px); font-weight: 800; letter-spacing: -1px; margin: 16px 0 2px; line-height: 1.1; }
  .note { color: var(--dim); font-size: 15px; margin: 4px 0 12px; }
  .tabs { display: flex; gap: 8px; margin: 16px 0; }
  .tab { flex: 1; min-height: 56px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: 800 17px Manrope, sans-serif; cursor: pointer; position: relative; }
  .tab.sel { background: var(--lime); color: #000; border-color: var(--lime); }
  .tab .n { position: absolute; top: -8px; right: -4px; background: var(--red); color: #fff; font-size: 12px; font-weight: 800; border-radius: 999px; min-width: 22px; height: 22px; line-height: 22px; text-align: center; padding: 0 5px; }
  .tab.sel .n { background: #000; color: var(--lime); }
  .task { display: flex; gap: 12px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 10px 0; }
  .task.done { opacity: .55; }
  .task .check { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--dim); background: none; cursor: pointer; font-size: 16px; color: transparent; line-height: 1; margin-top: 2px; }
  .task.done .check { background: var(--lime); border-color: var(--lime); color: #000; }
  .task .body { flex: 1; min-width: 0; }
  .task b { font-size: 17px; font-weight: 800; display: block; }
  .task.done b { text-decoration: line-through; }
  .task .meta { color: var(--dim); font-size: 14px; margin-top: 2px; }
  .task .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .task .links a { display: inline-block; background: var(--lime-soft); color: var(--lime); font-size: 14px; font-weight: 700; text-decoration: none; border-radius: 999px; padding: 5px 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task .links a:hover { text-decoration: underline; }
  .fld { display: block; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 14px 0 0; }
  .link-row { display: flex; gap: 8px; margin: 6px 0; }
  .link-row input { margin: 0; }
  .link-row .lbl { flex: 0 0 38%; min-width: 0; }
  .link-row .url { flex: 1; min-width: 0; }
  .link-row .rm { flex: 0 0 auto; background: none; border: 0; color: var(--red); font-size: 20px; font-weight: 800; cursor: pointer; padding: 0 4px; line-height: 1; align-self: center; }
  .add-link { background: none; border: 1px dashed var(--line); color: var(--dim); font: 700 15px Manrope, sans-serif; border-radius: 12px; padding: 10px 14px; cursor: pointer; margin-top: 4px; }
  .add-link:hover { color: var(--fg); border-color: var(--dim); }
  .add-link:disabled { opacity: .4; cursor: default; }
  .task .del { flex: 0 0 auto; background: none; border: 0; color: var(--red); font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px 0 0; }
  .task .edit { flex: 0 0 auto; background: none; border: 0; color: var(--lime); font-size: 14px; font-weight: 700; cursor: pointer; padding: 4px 0 0; margin-right: 10px; }
  .edit-form { flex: 1; min-width: 0; }
  .edit-form input, .edit-form textarea { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: #0E0F10; color: var(--fg); font: 600 16px Manrope, sans-serif; padding: 0 12px; margin: 4px 0; }
  .edit-form input:focus, .edit-form textarea:focus { outline: none; border-color: var(--lime); }
  .edit-form textarea { min-height: 60px; padding: 10px 12px; resize: vertical; }
  .edit-form .row { display: flex; gap: 8px; }
  .edit-form .row .btn { margin-top: 6px; width: auto; min-width: 0; }
  .edit-form .btn.save { flex: 1; min-height: 50px; font-size: 16px; }
  .edit-form .btn.cancel { flex: 0 0 auto; background: var(--card2); color: var(--fg); min-height: 50px; font-size: 16px; padding: 0 20px; }
  form.add { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-top: 20px; }
  form.add b { font-size: 19px; font-weight: 800; }
  form.add input, form.add textarea, form.add select { width: 100%; min-height: 54px; border-radius: 14px; border: 1px solid var(--line); background: #0E0F10; color: var(--fg); font: 600 16px Manrope, sans-serif; padding: 0 14px; margin: 8px 0; }
  form.add input:focus, form.add textarea:focus, form.add select:focus { outline: none; border-color: var(--lime); }
  form.add textarea { min-height: 68px; padding: 12px 14px; resize: vertical; }
  .who { display: flex; gap: 8px; margin: 8px 0; }
  .who button { flex: 1; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: #0E0F10; color: var(--fg); font: 800 16px Manrope, sans-serif; cursor: pointer; }
  .who button.sel { background: var(--lime); color: #000; border-color: var(--lime); }
  .btn { display: block; width: 100%; min-height: 58px; border-radius: 16px; border: 0; font-size: 18px; font-weight: 800; cursor: pointer; background: var(--lime); color: #000; margin-top: 10px; font-family: Manrope, sans-serif; }
  .btn:active { transform: scale(.99); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">Str8<span>Tech</span></div>
    <a class="back" href="./">← Suite</a>
  </div>
  <h1>Tasks</h1>
  <p class="note" id="note">Give someone a job. They will see it on their own page.</p>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>

  <form class="add" id="addForm">
    <b>Add a task</b>
    <div class="who" id="who">
      <button type="button" data-p="Nash">Nash</button>
      <button type="button" data-p="Barclay">Barclay</button>
      <button type="button" data-p="Cole">Cole</button>
    </div>
    <input id="fTitle" type="text" placeholder="What needs doing? (e.g. Test the website)" maxlength="200" required>
    <textarea id="fNotes" placeholder="Notes (optional)" maxlength="500"></textarea>
    <label class="fld" for="linksBox">Links (up to 5)</label>
    <div id="linksBox"></div>
    <button class="add-link" id="addLink" type="button">+ Add a link</button>
    <button class="btn" type="submit">Add task</button>
  </form>
</div>
<script src="../call/config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var base = (window.STR8TECH_CALL ? STR8TECH_CALL.base() : location.origin).replace(/\/$/, '');
  var PEOPLE = ['Nash', 'Barclay', 'Cole'];
  var sel = 'Cole';
  var who = 'Cole';
  var tasks = [];
  function pin() { return localStorage.getItem('str8tech-pin') || ''; }
  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'X-Staff-Pin': pin(), 'Content-Type': 'application/json' }, opts.headers || {});
    return fetch(base + path, opts);
  }
  function load() {
    return api('/api/tasks').then(function (r) {
      if (r.status === 401) { localStorage.removeItem('str8tech-pin'); $('note').textContent = 'That PIN did not work. Go back and re-enter it.'; throw new Error('bad pin'); }
      return r.json();
    }).then(function (list) { tasks = list || []; render(); }).catch(function () {});
  }
  function render() {
    var tabs = $('tabs');
    tabs.innerHTML = '';
    PEOPLE.forEach(function (p) {
      var open = tasks.filter(function (t) { return t.person === p && !t.done; }).length;
      var b = document.createElement('button');
      b.className = 'tab' + (p === sel ? ' sel' : '');
      b.type = 'button';
      b.textContent = p;
      if (open) { var n = document.createElement('span'); n.className = 'n'; n.textContent = open; b.appendChild(n); }
      b.onclick = function () { sel = p; render(); };
      tabs.appendChild(b);
    });
    var box = $('list');
    box.innerHTML = '';
    var list = tasks.filter(function (t) { return t.person === sel; }).sort(function (a, b) { return (a.done - b.done) || (a.createdAt < b.createdAt ? -1 : 1); });
    if (!list.length) { box.innerHTML = '<p class="note">Nothing for ' + sel + ' yet.</p>'; }
    list.forEach(function (t) {
      var d = document.createElement('div'); d.className = 'task' + (t.done ? ' done' : '');
      var c = document.createElement('button'); c.className = 'check'; c.type = 'button'; c.textContent = '✓'; c.setAttribute('aria-label', t.done ? 'Mark not done' : 'Mark done');
      c.onclick = function () { api('/api/tasks/' + encodeURIComponent(t.id) + '/done', { method: 'POST', body: JSON.stringify({ done: !t.done }) }).then(load); };
      d.appendChild(c);
      var body = document.createElement('div'); body.className = 'body';
      var b = document.createElement('b'); b.textContent = t.title; body.appendChild(b);
      var bits = [];
      if (t.notes) bits.push(t.notes);
      bits.push(new Date(t.createdAt).toLocaleDateString([], { month: 'short', day: 'numeric' }));
      var m = document.createElement('div'); m.className = 'meta'; m.textContent = bits.join(' · '); body.appendChild(m);
      if (Array.isArray(t.links) && t.links.length) {
        var lw = document.createElement('div'); lw.className = 'links';
        t.links.forEach(function (l) {
          if (!l || !l.url) return;
          var a = document.createElement('a');
          a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = l.label || l.url;
          lw.appendChild(a);
        });
        if (lw.childNodes.length) body.appendChild(lw);
      }
      d.appendChild(body);
      var ed = document.createElement('button'); ed.className = 'edit'; ed.textContent = 'Edit';
      ed.onclick = function () { showEdit(t, d); };
      d.appendChild(ed);
      var del = document.createElement('button'); del.className = 'del'; del.textContent = 'Delete';
      del.onclick = function () { if (confirm('Delete "' + t.title + '"?')) api('/api/tasks/' + encodeURIComponent(t.id), { method: 'DELETE' }).then(load); };
      d.appendChild(del);
      box.appendChild(d);
    });
    document.querySelectorAll('#who button').forEach(function (b) { b.classList.toggle('sel', b.getAttribute('data-p') === who); });
  }
  // Inline edit: swap the task card for a form with its current values.
  function showEdit(t, card) {
    card.innerHTML = '';
    var f = document.createElement('div'); f.className = 'edit-form';
    var ti = document.createElement('input'); ti.type = 'text'; ti.value = t.title; ti.maxLength = 200; ti.placeholder = 'What needs doing?';
    var no = document.createElement('textarea'); no.value = t.notes || ''; no.maxLength = 500; no.placeholder = 'Notes (optional)';
    f.appendChild(ti); f.appendChild(no);
    var lb = document.createElement('span'); lb.className = 'fld'; lb.textContent = 'Links (up to 5)'; f.appendChild(lb);
    var lbox = document.createElement('div'); f.appendChild(lbox);
    function editLinkRow(label, url) {
      if (lbox.querySelectorAll('.link-row').length >= 5) return;
      var row = document.createElement('div'); row.className = 'link-row';
      var lbl = document.createElement('input'); lbl.className = 'lbl'; lbl.type = 'text'; lbl.placeholder = 'Label (e.g. The demo site)'; lbl.maxLength = 60; lbl.value = label || '';
      var u = document.createElement('input'); u.className = 'url'; u.type = 'url'; u.placeholder = 'https://…'; u.maxLength = 500; u.value = url || '';
      var rm = document.createElement('button'); rm.className = 'rm'; rm.type = 'button'; rm.textContent = '×'; rm.setAttribute('aria-label', 'Remove this link');
      rm.onclick = function () { row.remove(); addBtn.disabled = false; };
      row.appendChild(lbl); row.appendChild(u); row.appendChild(rm);
      lbox.appendChild(row);
      if (lbox.querySelectorAll('.link-row').length >= 5) addBtn.disabled = true;
    }
    var addBtn = document.createElement('button'); addBtn.className = 'add-link'; addBtn.type = 'button'; addBtn.textContent = '+ Add a link';
    addBtn.onclick = function () { editLinkRow('', ''); };
    f.appendChild(addBtn);
    var saved = Array.isArray(t.links) ? t.links : [];
    if (saved.length) saved.forEach(function (l) { editLinkRow(l.label, l.url); });
    else editLinkRow('', '');
    var row = document.createElement('div'); row.className = 'row';
    var save = document.createElement('button'); save.className = 'btn save'; save.type = 'button'; save.textContent = 'Save';
    save.onclick = function () {
      var title = ti.value.trim();
      if (!title) return;
      var links = [];
      Array.prototype.forEach.call(lbox.querySelectorAll('.link-row'), function (r) {
        var url = r.querySelector('.url').value.trim();
        if (!url) return;
        links.push({ label: r.querySelector('.lbl').value.trim() || url, url: url });
      });
      api('/api/tasks/' + encodeURIComponent(t.id), { method: 'PUT', body: JSON.stringify({ title: title, notes: no.value.trim(), links: links.slice(0, 5) }) }).then(function (r) {
        if (r.status === 401) { localStorage.removeItem('str8tech-pin'); }
        if (!r.ok) throw new Error('save failed');
        return load();
      }).catch(function () { $('note').textContent = 'Could not save that task. Check the PIN and try again.'; });
    };
    var cancel = document.createElement('button'); cancel.className = 'btn cancel'; cancel.type = 'button'; cancel.textContent = 'Cancel';
    cancel.onclick = function () { render(); };
    row.appendChild(save); row.appendChild(cancel);
    f.appendChild(row);
    card.appendChild(f);
  }
  document.querySelectorAll('#who button').forEach(function (b) { b.onclick = function () { who = b.getAttribute('data-p'); render(); }; });
  // Links: up to 5 rows, each label + URL. One row to start.
  function linkRowCount() { return $('linksBox').querySelectorAll('.link-row').length; }
  function addLinkRow() {
    if (linkRowCount() >= 5) return;
    var row = document.createElement('div'); row.className = 'link-row';
    var lbl = document.createElement('input'); lbl.className = 'lbl'; lbl.type = 'text'; lbl.placeholder = 'Label (e.g. The demo site)'; lbl.maxLength = 60;
    var url = document.createElement('input'); url.className = 'url'; url.type = 'url'; url.placeholder = 'https://…'; url.maxLength = 500;
    var rm = document.createElement('button'); rm.className = 'rm'; rm.type = 'button'; rm.textContent = '×'; rm.setAttribute('aria-label', 'Remove this link');
    rm.onclick = function () { row.remove(); $('addLink').disabled = false; };
    row.appendChild(lbl); row.appendChild(url); row.appendChild(rm);
    $('linksBox').appendChild(row);
    if (linkRowCount() >= 5) $('addLink').disabled = true;
  }
  $('addLink').onclick = addLinkRow;
  addLinkRow();
  function collectLinks() {
    var out = [];
    Array.prototype.forEach.call($('linksBox').querySelectorAll('.link-row'), function (row) {
      var url = row.querySelector('.url').value.trim();
      if (!url) return;
      var label = row.querySelector('.lbl').value.trim() || url;
      out.push({ label: label, url: url });
    });
    return out.slice(0, 5);
  }
  $('addForm').onsubmit = function (e) {
    e.preventDefault();
    var t = { person: who, title: $('fTitle').value.trim(), notes: $('fNotes').value.trim(), links: collectLinks() };
    if (!t.title) return;
    api('/api/tasks', { method: 'POST', body: JSON.stringify(t) }).then(function (r) {
      if (r.status === 401) { localStorage.removeItem('str8tech-pin'); }
      if (!r.ok) throw new Error('save failed');
      $('fTitle').value = ''; $('fNotes').value = '';
      $('linksBox').innerHTML = ''; addLinkRow(); $('addLink').disabled = false;
      sel = who;
      return load();
    }).catch(function () { $('note').textContent = 'Could not save that task. Check the PIN and try again.'; });
  };
  if (!pin()) $('note').textContent = 'Enter your staff PIN on the suite page first.';
  else load();
  render();
})();
</script>
</body>
</html>
