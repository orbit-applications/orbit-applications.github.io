<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Str8Tech</title>
<meta name="description" content="Call Str8Tech right from your browser. We answer, or take a message for the team.">
<style>
  :root { --lime: #A6CE39; --bg: #000; --fg: #fff; --dim: #9a9a9a; --card: #111; --line: #262626; --red: #ff5a5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
  body { font: 18px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 640px; padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-weight: 800; font-size: 22px; letter-spacing: .5px; color: var(--fg); text-decoration: none; }
  .logo span { color: var(--lime); }
  main { width: 100%; max-width: 640px; padding: 12px 20px 32px; display: flex; flex-direction: column; align-items: center; text-align: center; flex: 1; }
  h1 { font-size: clamp(28px, 7vw, 40px); margin: 14px 0 6px; line-height: 1.1; }
  .sub { color: var(--dim); margin: 0 0 22px; }
  .callbtn { width: 170px; height: 170px; border-radius: 50%; border: 0; background: var(--lime); color: #000; font-size: 26px; font-weight: 800; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 0 0 0 rgba(166,206,57,.5); animation: pulse 2.4s infinite; }
  .callbtn svg { width: 46px; height: 46px; }
  .callbtn:active { transform: scale(.97); }
  .callbtn:focus-visible, .btn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(166,206,57,.45); } 70% { box-shadow: 0 0 0 26px rgba(166,206,57,0); } 100% { box-shadow: 0 0 0 0 rgba(166,206,57,0); } }
  .status { margin: 22px 0 6px; font-size: 20px; font-weight: 700; min-height: 1.45em; }
  .status.lime { color: var(--lime); }
  .hint { color: var(--dim); font-size: 15px; min-height: 1.4em; margin: 0 0 14px; }
  .nash { display: none; background: var(--lime); color: #000; font-weight: 800; padding: 12px 18px; border-radius: 14px; margin: 4px 0 14px; font-size: 20px; }
  .transcript { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; text-align: left; max-height: 42vh; overflow-y: auto; display: none; }
  .msg { margin: 8px 0; padding: 10px 14px; border-radius: 14px; max-width: 88%; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.ai, .msg.nash-line { background: #1d1d1d; }
  .msg.nash-line { border-left: 4px solid var(--lime); }
  .msg.visitor { background: #2a3a10; margin-left: auto; }
  .who { display: block; font-size: 13px; color: var(--dim); margin-bottom: 2px; }
  .row { display: flex; gap: 12px; width: 100%; margin-top: 16px; }
  .btn { flex: 1; min-height: 60px; border-radius: 16px; border: 0; font-size: 20px; font-weight: 800; cursor: pointer; }
  .btn.end { background: var(--red); color: #fff; }
  .btn.lime { background: var(--lime); color: #000; }
  .btn.ghost { background: transparent; color: var(--fg); border: 2px solid #444; }
  .typebox { display: none; width: 100%; gap: 10px; margin-top: 12px; }
  .typebox input { flex: 1; min-width: 0; min-height: 56px; border-radius: 14px; border: 2px solid #333; background: #0c0c0c; color: #fff; font-size: 18px; padding: 0 14px; }
  .typebox .btn { flex: 0 0 96px; }
  .linkbtn { background: none; border: 0; color: var(--dim); text-decoration: underline; font-size: 15px; margin-top: 12px; cursor: pointer; display: none; }
  .tapaudio { display: none; }
  footer { color: var(--dim); font-size: 14px; padding: 18px 20px 26px; text-align: center; }
  footer a { color: var(--dim); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <a class="logo" href="https://str8tech.ca">Str8<span>Tech</span></a>
</header>
<main>
  <h1 id="title">Talk to Str8Tech</h1>
  <p class="sub" id="sub">Tap Call to reach the Str8Tech team. If no one is free, our assistant takes a message.</p>

  <button class="callbtn" id="callBtn" aria-label="Call Str8Tech">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
    Call
  </button>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div class="hint" id="hint"></div>
  <div class="nash" id="nashBanner">You're now talking to Nash</div>
  <button class="btn lime tapaudio" id="tapAudio">Tap to hear Nash</button>

  <div class="transcript" id="transcript" aria-live="polite"></div>

  <div class="typebox" id="typebox">
    <input id="typeIn" type="text" placeholder="Type your question" aria-label="Type your question" autocomplete="off">
    <button class="btn lime" id="typeSend">Send</button>
  </div>
  <button class="linkbtn" id="typeLink">Can't talk right now? Type instead</button>

  <div class="row hidden" id="endRow">
    <button class="btn end" id="endBtn">End call</button>
  </div>
  <div class="row hidden" id="againRow">
    <button class="btn lime" id="againBtn">Call again</button>
  </div>
</main>
<footer><a href="mailto:support@str8tech.ca">support@str8tech.ca</a></footer>
<audio id="remote" playsinline></audio>
<audio id="voice" playsinline></audio>

<script src="config.js"></script>
<script src="relay.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var ws = null, relay = null, state = 'idle';
  var rec = null, listening = false, wantListen = false, srFails = 0;
  var endAfterSpeech = false, wrapAsked = false, rep = 'Nash', micDenied = false;
  var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var T = window.__call = { state: 'idle', hold: false, onHold: false, nash: false, relay: null, lines: [], mic: '' };

  function setStatus(text, lime) { $('status').textContent = text; $('status').className = 'status' + (lime ? ' lime' : ''); }
  function hint(text) { $('hint').textContent = text || ''; }
  function setState(s) { state = T.state = s; }

  // ---------- transcript ----------
  function addLine(speaker, text) {
    T.lines.push({ speaker: speaker, text: text, at: performance.now() });
    var d = document.createElement('div');
    var cls = speaker === 'visitor' ? 'visitor' : speaker === 'nash' ? 'nash-line' : 'ai';
    var who = speaker === 'visitor' ? 'You' : speaker === 'nash' ? rep : speaker === 'system' ? '' : 'Str8Tech assistant';
    if (speaker === 'system') { d.className = 'who'; d.style.textAlign = 'center'; d.textContent = text; }
    else {
      d.className = 'msg ' + cls;
      var w = document.createElement('span'); w.className = 'who'; w.textContent = who;
      d.appendChild(w); d.appendChild(document.createTextNode(text));
    }
    $('transcript').appendChild(d);
    $('transcript').scrollTop = $('transcript').scrollHeight;
  }

  // ---------- speaking (the server's voice, played in order) ----------
  // Each AI line arrives as text first ('line' with a sid), then its audio ('voice' with the same sid).
  var speakQ = [], voices = {}, playing = false, voiceUrl = null;
  T.spoken = 0; T.voiceErrors = 0; T.voiceName = '';
  function speakingCount() { return speakQ.length + (playing ? 1 : 0); }
  function expectVoice(sid) {
    stopListening();
    speakQ.push(sid);
    // Never get stuck if the audio doesn't arrive.
    setTimeout(function () { if (speakQ.indexOf(sid) >= 0 && !voices[sid]) { voices[sid] = { error: true }; pumpVoice(); } }, 15000);
  }
  function gotVoice(m) {
    if (speakQ.indexOf(m.sid) < 0) return;
    voices[m.sid] = m;
    pumpVoice();
  }
  function pumpVoice() {
    if (playing) return;
    while (speakQ.length && voices[speakQ[0]]) {
      var m = voices[speakQ[0]]; delete voices[speakQ.shift()];
      if (m.error || !m.data) { T.voiceErrors++; continue; }
      return playVoice(m);
    }
    if (!speakQ.length) afterSpeech();
  }
  function playVoice(m) {
    var bin = atob(m.data), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    if (voiceUrl) URL.revokeObjectURL(voiceUrl);
    voiceUrl = URL.createObjectURL(new Blob([bytes], { type: m.mime || 'audio/mpeg' }));
    var a = $('voice');
    playing = true; T.voiceName = m.voice || '';
    a.onended = a.onerror = function () { if (!playing) return; playing = false; T.spoken++; pumpVoice(); };
    a.src = voiceUrl;
    var p = a.play();
    if (p && p.catch) p.catch(function () { playing = false; T.voiceErrors++; pumpVoice(); });
  }
  function stopVoice() {
    speakQ = []; voices = {};
    if (playing) { playing = false; try { $('voice').pause(); } catch (e) {} }
  }
  function afterSpeech() {
    if (speakingCount()) return;
    if (endAfterSpeech) return hangUp(false);
    if (state === 'live') startListening();
  }

  // ---------- listening ----------
  function showTyping() { $('typebox').style.display = 'flex'; $('typeLink').style.display = 'none'; }
  function startListening() {
    wantListen = true;
    if (!SR || listening || speakingCount() || micDenied || T.onHold) return;
    if (serverState === 'holding') return; // waiting for a person: nobody is listening yet
    if (state === 'human' && mobile) return; // mic goes to the audio relay on phones
    rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onresult = function (e) {
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var t = e.results[i][0].transcript.trim();
        if (!t) continue;
        if (e.results[i].isFinal) heard(t);
      }
    };
    rec.onerror = function (e) {
      if (/not-allowed|service-not-allowed|audio-capture/.test(e.error) || (e.error === 'network' && ++srFails > 2)) {
        wantListen = false; showTyping();
        hint('Voice is not available here. Type your question below.');
      }
    };
    rec.onend = function () { listening = false; if (wantListen && !speakingCount()) setTimeout(startListening, 200); };
    try { rec.start(); listening = true; if (state === 'live') hint('Listening… just talk.'); } catch (e) { listening = false; }
  }
  function stopListening() {
    wantListen = false;
    if (rec) { try { rec.abort(); } catch (e) {} }
    listening = false;
  }
  function heard(text) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'heard', text: text }));
  }

  // ---------- every call starts on hold for a person ----------
  // The server puts the caller on hold the moment the call connects (hold music first, then
  // "Let me connect you…"). Nobody is listening while it waits, so the mic and typing are off
  // until a person takes over or, after 2 minutes, the assistant comes in to take a message.
  var serverState = 'holding';
  function holdWait(seconds) {
    var s = Number(seconds) || 120;
    return s % 60 === 0 ? (s / 60) + ' minute' + (s === 60 ? '' : 's') : s + ' seconds';
  }
  function typingUi() {
    if (state !== 'live' || serverState === 'human' || serverState === 'ended') return;
    if (serverState === 'holding') { $('typebox').style.display = 'none'; $('typeLink').style.display = 'none'; return; }
    if (!SR || micDenied) showTyping();
    else if ($('typebox').style.display !== 'flex') $('typeLink').style.display = 'block';
  }

  // ---------- hold music (WebAudio, soft looping chime pad) ----------
  var actx = null, holdGain = null, holdTimer = null;
  T.holdStarts = [];
  function initAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !actx) actx = new AC();
    if (actx && actx.state === 'suspended') actx.resume();
  }
  var CHORDS = [[261.63, 329.63, 392.0, 493.88], [220.0, 261.63, 329.63, 392.0], [174.61, 220.0, 261.63, 329.63], [196.0, 246.94, 293.66, 392.0]];
  function holdOn() {
    if (T.hold) return;
    T.hold = true;
    T.holdStarts.push(performance.now());
    if (!actx || holdTimer) return;
    if (actx.state !== 'running') actx.resume(); // phones can suspend it while the mic or voice had the audio
    holdGain = actx.createGain();
    holdGain.gain.setValueAtTime(0, actx.currentTime);
    holdGain.gain.linearRampToValueAtTime(0.22, actx.currentTime + 0.25); // audible right away
    holdGain.connect(actx.destination);
    var i = 0;
    function bar() {
      var t = actx.currentTime, chord = CHORDS[i++ % CHORDS.length];
      chord.forEach(function (f, k) {
        // pad
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f / 2;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.09, t + (i === 1 ? 0.3 : 1.0)); g.gain.linearRampToValueAtTime(0, t + 4.4);
        o.connect(g); g.connect(holdGain); o.start(t); o.stop(t + 4.5);
        // chime
        var c = actx.createOscillator(), cg = actx.createGain(), ct = t + 0.05 + k * 0.45;
        c.type = 'triangle'; c.frequency.value = f * 2;
        cg.gain.setValueAtTime(0, ct); cg.gain.linearRampToValueAtTime(0.07, ct + 0.02); cg.gain.exponentialRampToValueAtTime(0.0001, ct + 1.8);
        c.connect(cg); cg.connect(holdGain); c.start(ct); c.stop(ct + 1.9);
      });
    }
    bar(); holdTimer = setInterval(bar, 4000);
    T.music = true;
  }
  function holdOff() {
    T.hold = false; T.music = false;
    if (holdTimer) { clearInterval(holdTimer); holdTimer = null; }
    if (holdGain && actx) {
      var g = holdGain; holdGain = null;
      g.gain.cancelScheduledValues(actx.currentTime);
      g.gain.setValueAtTime(g.gain.value, actx.currentTime);
      g.gain.linearRampToValueAtTime(0, actx.currentTime + 0.6);
      setTimeout(function () { g.disconnect(); }, 800);
    }
  }

  // ---------- call ----------
  function startCall() {
    // Microphone prompt first, the instant they tap. The greeting only starts after they answer it.
    var mic = askMic();
    initAudio();
    unlockAudio($('remote'));
    unlockAudio($('voice')); // the assistant's voice plays here; unlock it during the tap (iOS)
    stopVoice();
    setState('connecting'); endAfterSpeech = false; wrapAsked = false; serverState = 'holding'; T.onHold = false;
    $('callBtn').classList.add('hidden');
    $('title').textContent = 'Calling Str8Tech…';
    $('sub').classList.add('hidden');
    $('transcript').innerHTML = ''; $('transcript').style.display = 'block';
    $('nashBanner').style.display = 'none';
    $('endRow').classList.remove('hidden'); $('againRow').classList.add('hidden');
    $('endBtn').textContent = 'End call';
    $('typebox').style.display = 'none'; $('typeLink').style.display = 'none'; // shown once the assistant is listening
    setStatus('Allow the microphone', true);
    hint('Tap Allow so we can hear you.');
    mic.then(connect);
  }

  function askMic() {
    T.mic = 'asking'; T.micAskedAt = performance.now();
    var md = navigator.mediaDevices;
    var p = md && md.getUserMedia ? md.getUserMedia({ audio: true }) : Promise.reject(new Error('no mic'));
    return p.then(function (s) {
      micDenied = false; T.mic = 'granted';
      s.getTracks().forEach(function (t) { t.stop(); }); // permission is all we need now; listening opens it again
    }, function () {
      micDenied = true; T.mic = 'denied';
    }).then(function () { T.micAnsweredAt = performance.now(); });
  }

  function connect() {
    if (state !== 'connecting') return; // they hung up while the mic prompt was open
    setStatus('Connecting…');
    hint(micDenied ? 'The microphone is off. You will still hear us, and you can type if the assistant comes on.' : '');

    try { ws = new WebSocket(STR8TECH_CALL.wsUrl()); } catch (e) { return failed(); }
    T.wsAt = performance.now();
    ws.binaryType = 'arraybuffer';
    relay = T.relay = AudioRelay(ws, $('remote'), function () { $('tapAudio').style.display = 'block'; });
    var opened = false;
    ws.onopen = function () { opened = true; ws.send(JSON.stringify({ type: 'start' })); };
    ws.onerror = function () { if (!opened) failed(); };
    ws.onclose = function () { if (state !== 'ended' && state !== 'idle') hangUp(false); };
    ws.onmessage = function (e) {
      if (e.data instanceof ArrayBuffer) return relay.receive(e.data);
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.type === 'call') {
        T.id = m.id;
        setState('live'); $('title').textContent = "You're on the line";
        setStatus('Connected', true);
      } else if (m.type === 'line') {
        addLine(m.speaker, m.text);
        if (m.speak && m.sid && state !== 'human') expectVoice(m.sid);
        if (m.text.indexOf('Before you go') === 0) wrapAsked = true;
      } else if (m.type === 'voice') {
        if (state !== 'human') gotVoice(m);
      } else if (m.type === 'state') {
        serverState = m.state;
        typingUi();
      } else if (m.type === 'hold') {
        onHold(m);
      } else if (m.type === 'transferring') {
        if (T.onHold) hint('Transferring you to ' + m.to + '. Please hold.');
      } else if (m.type === 'human-joined') {
        nashJoined(m.text, m.name);
      } else if (m.type === 'audio-start') {
        relay.startReceiving(m.mime);
      } else if (m.type === 'end') {
        if (state === 'human' || !speakingCount()) hangUp(false); else endAfterSpeech = true;
      }
    };
  }

  function onHold(m) {
    if (m.on) {
      holdOn();
      if (m.reason === 'advisor' || m.reason === 'transfer') {
        // The person on the call put them on hold (or is transferring): no audio either way.
        T.onHold = true;
        stopListening();
        if (relay) { relay.stopSending(); relay.stopReceiving(); }
        $('tapAudio').style.display = 'none';
        $('nashBanner').style.display = 'none';
        setStatus("You're on hold", true);
        hint(m.reason === 'transfer' ? 'Transferring you. Please hold.' : 'Please hold. ' + rep + ' will be right back.');
      } else {
        stopListening();
        setStatus('Connecting you to a person…', true);
        hint('Please hold. This takes up to ' + holdWait(m.seconds) + '.');
      }
      return;
    }
    holdOff();
    if (T.onHold) {
      T.onHold = false;
      if (state === 'human' && m.reason !== 'transferred') talkingTo(); // back with the same person
    } else if (state === 'live') { setStatus('Connected', true); hint(''); }
  }

  // Mic on to the person on the call (a fresh audio stream, so a new listener can decode it).
  function talkingTo() {
    $('nashBanner').style.display = 'block';
    setStatus('Connected to ' + rep, true);
    hint('Just talk. ' + rep + ' can hear you.');
    relay.restartSending().then(function () {
      if (!mobile && SR) startListening(); // keep the transcript going where the browser allows it
    }).catch(function () {
      hint('Please allow the microphone so ' + rep + ' can hear you.');
    });
  }

  function nashJoined(text, name) {
    name = name || 'Nash';
    rep = name;
    setState('human'); T.nash = true; T.onHold = false;
    holdOff();
    stopVoice();
    stopListening();
    $('typebox').style.display = 'none'; $('typeLink').style.display = 'none';
    $('nashBanner').textContent = text || "You're now talking to " + name;
    $('tapAudio').textContent = 'Tap to hear ' + name;
    $('nashBanner').style.display = 'block';
    $('title').textContent = "You're on the line";
    relay.stopReceiving(); // after a transfer, the new person starts their own stream
    talkingTo();
  }

  function failed() {
    setStatus("Sorry, we couldn't connect. Please email support@str8tech.ca.");
    endUi();
  }

  function hangUp(sendIt) {
    if (state === 'ended' || state === 'idle') return;
    if (sendIt && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'hang-up' }));
    setState('ended');
    stopListening(); holdOff();
    if (!endAfterSpeech) stopVoice();
    if (relay) relay.stop();
    try { ws && ws.close(); } catch (e) {}
    $('title').textContent = 'Call ended';
    setStatus('Thanks for calling Str8Tech.', true);
    hint('');
    endUi();
  }
  function endUi() {
    setState(state === 'ended' ? 'ended' : 'idle');
    $('endRow').classList.add('hidden');
    $('againRow').classList.remove('hidden');
    $('typebox').style.display = 'none'; $('typeLink').style.display = 'none';
    $('tapAudio').style.display = 'none';
  }

  $('callBtn').onclick = startCall;
  $('againBtn').onclick = function () { setState('idle'); startCall(); };
  $('endBtn').onclick = function () {
    // First tap: the assistant asks for contact info. Second tap: hang up now.
    if (state === 'live' && !wrapAsked && serverState !== 'holding' && ws && ws.readyState === 1) {
      wrapAsked = true;
      ws.send(JSON.stringify({ type: 'end-request' }));
      $('endBtn').textContent = 'Hang up now';
    } else hangUp(true);
  };
  $('typeLink').onclick = function () { showTyping(); $('typeIn').focus(); };
  function sendTyped() {
    var v = $('typeIn').value.trim();
    if (!v) return;
    $('typeIn').value = '';
    heard(v);
  }
  $('typeSend').onclick = sendTyped;
  $('typeIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendTyped(); });
  $('tapAudio').onclick = function () { $('remote').play(); $('tapAudio').style.display = 'none'; };
})();
</script>
</body>
</html>
